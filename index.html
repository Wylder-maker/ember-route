function readEditor() {
  const form=document.querySelector('#editor');
  const data=new FormData(form);
  const name=String(data.get('name')).trim();
  const num=(key)=>data.get(key)==='' ? NaN : Number(data.get(key));
  if(panel==='heroes'){
    return {id:draft.id,name,description:String(data.get('description')).trim(),hp:num('hp'),energy:num('energy'),draw:num('draw'),
      deck:design.cards.map(card=>({id:card.id,count:num('count-'+card.id)})).filter(entry=>entry.count>0),
      pool:design.cards.filter(card=>data.has('pool-'+card.id)).map(card=>card.id)};
  }
  if(panel==='enemies'){
    const readPlan=(plan,key)=>({
      turns:plan.turns.map((_,index)=>[data.get(key+'-intent-'+index),num(key+'-amount-'+index)]),
      loop:plan.turns.flatMap((_,index)=>data.has(key+'-loop-'+index)?[index+1]:[]),
    });
    const enemy={id:draft.id,name,kind:data.get('enemy-kind'),hp:num('hp'),intents:readPlan(draft.intents,'normal'),spawns:[]};
    if(draft.shape) enemy.shape=draft.shape;
    if(data.has('use-advanced')) enemy.advanced=readPlan(draft.advanced??draft.intents,'advanced');
    for(let act=1;act<=ACT_COUNT;act++){
      for(const {node} of combatNodes(act)){
        const count=num('spawn-'+act+'-'+node);
        if(count!==0) enemy.spawns.push({act,node,count});
      }
    }
    return enemy;
  }
  return {id:draft.id,name,kind:data.get('kind'),rarity:data.get('rarity'),cost:num('cost'),
    exhaust:data.has('exhaust'),innate:data.has('innate'),retain:data.has('retain'),upgradeCostReduction:num('upgradeCostReduction'),
    effects:draft.effects.map((_,i)=>{
      const type=data.get('effect-'+i);
      const effect={type,target:data.get('target-'+i)??effectTarget(draft,{type}),amount:num('amount-'+i),upgrade:num('upgrade-'+i),
        hits:num('hits-'+i),upgradeHits:num('upgradeHits-'+i),nextTurn:data.get('timing-'+i)==='next'};
      const key='growth-'+i;
      if(data.has(key) && canGrowEffect(data.get('kind'),effect.type)) effect.growth=num(key);
      if(type==='status'){
        const trigger=data.get('statusTrigger-'+i);
        effect.status={name:String(data.get('statusName-'+i)??'').trim(),decay:num('statusDecay-'+i),
          keepNegative:data.get('statusLifetime-'+i)==='negative',trigger};
        if(trigger==='card') Object.assign(effect.status,{cardKind:data.get('statusKind-'+i),
          rewardType:data.get('statusReward-'+i),rewardAmount:num('statusRewardAmount-'+i)});
        if(trigger==='attack') Object.assign(effect.status,{attackHits:num('statusAttackHits-'+i),attackBonus:num('statusAttackBonus-'+i)});
        if(trigger==='attackBleed') effect.status.bleedAmount=num('statusBleedAmount-'+i);
      }
      return effect;
    })};
}
function saveDesign(next) {
  design=validateDesign(next);
  write(DESIGN_KEY,design);
}
function editorError(message) {
  const field=document.querySelector('#form-message');
  field.textContent=message;
  field.hidden=false;
}
function deleteDesign() {
  const item=design[panel].find(entry=>entry.id===editId);
  if(!item) return;
  if(panel==='cards'){
    const used=design.heroes.filter(h=>h.pool.includes(editId)||h.deck.some(entry=>entry.id===editId));
    if(used.length){editorError('请先从 '+used.map(h=>h.name).join('、')+' 的起始牌组和奖励池中移除此卡。');return;}
  }
  showDialog('删除设计？','<p>删除「'+esc(item.name)+'」后，工坊将移除这项设计。</p><div class="actions end">'+
    button('取消','close-dialog','','button secondary')+button('确认删除','confirm-delete','','button primary')+'</div>');
}

function refreshRun() {
  write(RUN_KEY,run);
  render();
}
function startRun() {
  if(!heroId) return;
  run=newRun(design,heroId,selectedAscension);
  view='run';
  aimed=null;
  dialog.close();
  refreshRun();
  screen.focus();
}
function finishDeal(key) {
  run.taken.push(key);
  dialog.close();
  refreshRun();
}
function chooseDeal(key) {
  if(!canClaimDeal(key)) return;
  if(key==='heal'){changeHp(run,15);finishDeal(key);return;}
  if(key==='relic'){
    const relic=shuffle(RELICS.filter(r=>!hasRelic(run,r.id)))[0];
    if(relic){gainRelic(run,relic.id);finishDeal(key);notify('获得「'+relic.name+'」。');}
    return;
  }
  const entries=key==='card'?run.merchantCards.map(id=>({id,uid:id})):eligibleDeck(key);
  showDialog(DEALS[key][0],'<div class="cards-grid modal-grid">'+entries.map(entry=>{
    const attrs='data-key="'+key+'" data-id="'+entry.uid+'"';
    return cardTile(getCard(run,entry),key==='upgrade'?{...entry,upgraded:true}:entry,'deal-choice',attrs);
  }).join('')+'</div>');
}
function play(uid) {
  const b=run.battle;
  const entry=b.hand.find(item=>item.uid===uid);
  if(!entry) return;
  const card=getCard(run,entry);
  if(b.energy<cardCost(card,entry)){notify('能量不足。');return;}
  const living=b.enemies.flatMap((enemy,index)=>enemy.hp>0?[index]:[]);
  if(requiresTarget(card)&&living.length>1){
    aimed=aimed===uid?null:uid;
    render();
    if(aimed) screen.querySelector('.targetable')?.focus();
    return;
  }
  if(playCard(run,uid,living[0])){aimed=null;refreshRun();}
}
function exportDesign() {
  const blob=new Blob([JSON.stringify(design,null,2)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const download=document.createElement('a');
  download.href=url;
  download.download='ember-route-design.json';
  download.click();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
let imported;
importFile.addEventListener('change',async()=>{
  const file=importFile.files[0];
  importFile.value='';
  if(!file) return;
  try {
    if(file.size>1000000) throw new Error('设计文件最多支持 1 MB。');
    imported=validateDesign(JSON.parse(await file.text()));
    const furnace=imported.cards.find(card=>card.name===FURNACE_CARD_NAME);
    if(furnace) imported={...imported,cards:imported.cards.map(card=>card===furnace?updateFurnaceCard(card):card)};
    const vitality=imported.cards.find(card=>card.id==='a8' && card.name===VITALITY_CARD_NAME);
    if(vitality) imported={...imported,cards:imported.cards.map(card=>card===vitality?updateVitalityCard(card):card)};
    const bloodJoy=imported.cards.find(card=>card.id===BLOOD_JOY_CARD_ID);
    if(bloodJoy) imported={...imported,cards:imported.cards.map(card=>card===bloodJoy?updateBloodJoyCard(card):card)};
    showDialog('导入设计','<p>将工坊内容替换为文件中的 '+imported.heroes.length+' 个角色、'+imported.cards.length+' 张卡牌和 '+imported.enemies.length+' 个敌人设计。需要留存当前设计时可以先导出备份。</p>'+
      '<div class="actions end">'+button('导出当前设计','export','','button secondary')+button('确认导入','confirm-import','','button primary')+'</div>');
  } catch(error) {
    notify(error instanceof SyntaxError?'无法读取 JSON，请选择有效的工坊文件。':error.message);
  }
});

document.addEventListener('click',event=>{
  const control=event.target.closest('button[data-action]');
  if(!control || control.disabled) return;
  const {action,id,index,key}=control.dataset;
  switch(action){
    case 'home':
      view='home';render();break;
    case 'game':
      view=run?'run':'home';render();break;
    case 'lab':
      view='lab';render();break;
    case 'rules':
      showRules();break;
    case 'resume':
      view='run';render();break;
    case 'select-hero':
      screen.querySelector('#hero-select').focus();break;
    case 'start':
      if(run && run.view!=='victory' && run.view!=='defeat'){
        showDialog('另开一局？','<p>新冒险会替换现有冒险进度。</p><div class="actions end">'+button('取消','close-dialog','','button secondary')+button('开始新冒险','start-confirm','','button primary')+'</div>');
      } else startRun();
      break;
    case 'start-confirm': startRun();break;
    case 'draft-pick':
      if(run.picks.includes(id)) run.picks=run.picks.filter(pick=>pick!==id);
      else if(run.picks.length<Math.min(3,run.options.length)) run.picks.push(id);
      else {notify('名额已满，再点一次已选卡牌可以取消。');break;}
      refreshRun();
      screen.querySelector('[data-action="draft-pick"][data-id="'+id+'"]')?.focus();
      break;
    case 'draft-confirm':
      if(run.picks.length!==Math.min(3,run.options.length)) break;
      for(const pick of run.picks) addCard(run,pick);
      advance(run);refreshRun();screen.focus();break;
    case 'advance':
      if(!['act-clear','boss-clear','boss-reward','reward','merchant'].includes(run?.view)) break;
      advance(run);refreshRun();screen.focus();break;
    case 'reward-pick':
      if(!['reward','boss-reward'].includes(run?.view)||!run.options.includes(id)) break;
      addCard(run,id);advance(run);refreshRun();screen.focus();break;
    case 'open-chest':
      for(const relic of run.chest) gainRelic(run,relic);
      advance(run);refreshRun();screen.focus();break;
    case 'play': play(Number(id));break;
    case 'target':
      if(aimed && playCard(run,aimed,Number(index))){aimed=null;refreshRun();}
      break;
    case 'cancel-target':
      aimed=null;render();break;
    case 'end-turn':
      aimed=null;endTurn(run);refreshRun();break;
    case 'deal': chooseDeal(id);break;
    case 'deal-choice':
      if(!canClaimDeal(key)) break;
      if(key==='card'&&run.merchantCards.includes(id)) addCard(run,id);
      if(key==='upgrade'){
        const entry=eligibleDeck(key).find(card=>card.uid===Number(id));
        if(!entry) break;
        entry.upgraded=true;
      }
      if(key==='remove') run.deck=run.deck.filter(entry=>entry.uid!==Number(id));
      finishDeal(key);
      break;
    case 'show-deck':
      displayList(run.deck,'牌组 · '+run.deck.length+' 张');break;
    case 'pile': {
      const entries=id==='draw'?[...run.battle.draw].sort((a,b)=>a.uid-b.uid):run.battle[id];
      displayList(entries,{draw:'抽牌堆 · 按牌组顺序',discard:'弃牌堆',exhaust:'消耗牌堆'}[id]);break;
    }
    case 'show-log':
      showDialog('战报','<ol class="rule-list">'+run.battle.log.map(line=>'<li>'+esc(line)+'</li>').join('')+'</ol>');break;
    case 'show-buffs':
      showDialog('能力 Buff','<ol class="rule-list">'+(run.battle.buffs??[]).map(buff=>{
        const {entry,effect,activations}=buff;
        const card=getCard(run,entry);
        if(effect.type==='comboEnergy'){
          const progress=activations?'累计 '+(buff.damageSegments??0)+' / '+COMBO_DAMAGE_SEGMENTS+' 段':'下回合开始累计';
          return '<li><b>'+esc(card.name)+(entry.upgraded?'＋':'')+'</b><p>'+effectText(card,effect,entry)+'</p><p>'+progress+'</p></li>';
        }
        if(effect.type==='bleedBlock'){
          return '<li><b>'+esc(card.name)+(entry.upgraded?'＋':'')+'</b><p>'+effectText(card,effect,entry)+'</p>'+
            (activations?'':'<p>下回合开始生效</p>')+'</li>';
        }
        const current=activations>0 ? '本回合：'+effectText(card,effect,entry,powerAmount(buff,activations-1)) : '等待首次生效';
        const next=effectText(card,effect,entry,powerAmount(buff));
        return '<li><b>'+esc(card.name)+(entry.upgraded?'＋':'')+'</b><p>'+current+'</p><p>下回合：'+next+'</p></li>';
      }).join('')+'</ol>');
      break;
    case 'show-pending':
      showDialog('下回合待结算','<ol class="rule-list">'+(run.battle.pending??[]).map(({entry,effect,enemyIndex})=>{
        const card=getCard(run,entry);
        const foe=effectTarget(card,effect)==='single' ? run.battle.enemies[enemyIndex] : null;
        return '<li><b>'+esc(card.name)+(entry.upgraded?'＋':'')+'</b> · '+effectText(card,effect,entry)+
          (foe?'（'+esc(foe.name)+(foe.hp>0?'':'，已击败')+'）':'')+'</li>';
      }).join('')+'</ol>');
      break;
    case 'return-home':
      run=null;view='home';refreshRun();screen.focus();break;
    case 'tab':
      if(!Object.hasOwn(WORKSHOP_PANELS,id)) break;
      panel=id;selectEditor(design[panel][0]?.id);render();break;
    case 'edit':
      selectEditor(id);render();break;
    case 'new-item':
      selectEditor(null);render();screen.querySelector('[name="name"]').focus();break;
    case 'add-enemy-intent':
    case 'remove-enemy-intent': {
      if(panel!=='enemies'||!['normal','advanced'].includes(key)) break;
      if(document.querySelector('#editor').querySelector('input[type="number"]:invalid')){
        editorError('请先填写有效的数值。');
        break;
      }
      const current=readEditor();
      const plan=key==='normal'?current.intents:current.advanced;
      if(!plan) break;
      if(action==='add-enemy-intent'){
        if(plan.turns.length>=MAX_ENEMY_TURNS) break;
        plan.turns.push(['attack',7]);
      } else {
        const removed=Number(index)+1;
        if(plan.turns.length===1 || removed<1 || removed>plan.turns.length) break;
        plan.turns.splice(removed-1,1);
        plan.loop=plan.loop.filter(turn=>turn!==removed).map(turn=>turn>removed?turn-1:turn);
      }
      draft=current;render();
      break;
    }
    case 'add-effect':
    case 'remove-effect': {
      if(!document.querySelector('#editor').querySelectorAll('input[type="number"]:invalid').length){
        draft=readEditor();
        if(action==='add-effect') draft.effects.push({type:'block',amount:5,upgrade:2});
        else draft.effects.splice(Number(index),1);
        render();
      } else editorError('请先填写有效的数值。');
      break;
    }
    case 'delete-item': deleteDesign();break;
    case 'confirm-delete':
      saveDesign({...design,[panel]:design[panel].filter(item=>item.id!==editId)});
      selectEditor(design[panel][0]?.id);dialog.close();render();notify('设计已删除。');break;
    case 'export': exportDesign();break;
    case 'import': importFile.click();break;
    case 'confirm-import':
      saveDesign(imported);heroId=design.heroes[0]?.id;selectEditor(design[panel][0]?.id);dialog.close();render();notify('设计已导入。');break;
    case 'close-dialog': dialog.close();break;
  }
});
function syncGrowthField(form,index,kind,type) {
  const growth=form.elements.namedItem('growth-'+index);
  if(!growth) return;
  growth.disabled=!canGrowEffect(kind,type);
  growth.closest('.effect-growth').hidden=growth.disabled;
}
function syncStatusFields(form,index) {
  const fields=form.querySelector?.('#status-fields-'+index);
  if(!fields) return;
  fields.hidden=fields.disabled=form.elements.namedItem('effect-'+index).value!=='status';
  if(fields.disabled) return;
  const trigger=form.elements.namedItem('statusTrigger-'+index).value;
  for(const mode of ['card','attack','attackBleed']){
    const triggerFields=form.querySelector('#status-'+mode+'-'+index);
    triggerFields.hidden=triggerFields.disabled=trigger!==mode;
  }
  const reward=form.elements.namedItem('statusReward-'+index);
  const rewards=statusRewardOptions(form.elements.namedItem('target-'+index).value);
  reward.innerHTML=options(rewards,Object.hasOwn(rewards,reward.value)?reward.value:'block');
}
screen.addEventListener('change',event=>{
  if(event.target.id==='hero-select'){heroId=event.target.value;render();screen.querySelector('#hero-select').focus();}
  if(event.target.id==='ascension-select'){
    const level=Number(event.target.value);
    if(Number.isInteger(level)&&level>=0&&level<=MAX_ASCENSION) selectedAscension=level;
    render();screen.querySelector('#ascension-select').focus();
  }
  const {name,value,form}=event.target;
  if(form?.id!=='editor') return;
  if(panel==='enemies'){
    if(name==='use-advanced'){
      const fields=form.querySelector('#advanced-intents');
      fields.hidden=fields.disabled=!event.target.checked;
    }
    return;
  }
  const effectIndex=/^effect-(\d+)$/.exec(name)?.[1];
  if(effectIndex!==undefined){
    const target=form.elements.namedItem('target-'+effectIndex);
    if(target){
      const choices=effectTargetOptions(value);
      const previous=target.value;
      const preferred=target.options.length===1 ? effectTarget(draft,{type:value}) : previous;
      target.innerHTML=options(choices,Object.hasOwn(choices,preferred)?preferred:'self');
    }
    syncGrowthField(form,effectIndex,form.elements.namedItem('kind')?.value,value);
    syncStatusFields(form,effectIndex);
  }
  const statusIndex=/^(?:target|statusTrigger)-(\d+)$/.exec(name)?.[1];
  if(statusIndex!==undefined) syncStatusFields(form,statusIndex);
  if(name==='kind'){
    form.querySelector('#power-editor-help').hidden=value!=='power';
    for(let index=0;index<draft.effects.length;index++){
      syncGrowthField(form,index,value,form.elements.namedItem('effect-'+index).value);
    }
  }
});
screen.addEventListener('submit',event=>{
  if(event.target.id!=='editor') return;
  event.preventDefault();
  try {
    const item=readEditor();
    const list=editId?design[panel].map(entry=>entry.id===editId?item:entry):[...design[panel],item];
    savedWarning='';
    saveDesign({...design,[panel]:list});
    if(panel==='heroes') heroId=item.id;
    selectEditor(item.id);
    render();
    if(!savedWarning) notify('已保存「'+item.name+'」。');
  } catch(error) {editorError(error.message);}
});
document.addEventListener('keydown',event=>{
  if(view!=='run' || run?.view!=='combat' || dialog.open || event.altKey || event.ctrlKey||event.metaKey || event.repeat) return;
  if(event.key==='Escape'&&aimed){aimed=null;render();return;}
  if(event.key==='Enter'&&!event.target.closest('button,input,select,textarea')){
    event.preventDefault();aimed=null;endTurn(run);refreshRun();
  }
  if(/^[1-9]$/.test(event.key)){
    const entry=run.battle.hand[Number(event.key)-1];
    if(entry){event.preventDefault();play(entry.uid);}
  }
});
const packagedCombo=PACKAGED_DESIGN?.cards.find(card=>card.id===COMBO_CARD_ID);
const savedCombo=design.cards.find(card=>card.id===COMBO_CARD_ID);
if(packagedCombo && savedCombo && !read(COMBO_UPDATE_KEY)){
  if(!savedCombo.effects.some(effect=>effect.type==='comboEnergy')){
    const {kind,rarity,cost,innate,effects}=packagedCombo;
    saveDesign({...design,cards:design.cards.map(card=>card===savedCombo
      ? {...card,kind,rarity,cost,innate,effects:structuredClone(effects)} : card)});
  }
  write(COMBO_UPDATE_KEY,true);
}
const packagedBleed=PACKAGED_DESIGN?.cards.find(card=>card.id===SEPPUKU_CARD_ID)?.effects
  .find(effect=>effect.status?.trigger==='attackBleed');
const savedSeppuku=design.cards.find(card=>card.id===SEPPUKU_CARD_ID);
if(packagedBleed && savedSeppuku && !read(SEPPUKU_UPDATE_KEY)){
  if(savedSeppuku.effects.some(effect=>effect.status?.trigger==='attackBleed')){
    write(SEPPUKU_UPDATE_KEY,true);
  } else if(savedSeppuku.effects.length<6){
    saveDesign({...design,cards:design.cards.map(card=>card===savedSeppuku
      ? {...card,effects:[...card.effects,structuredClone(packagedBleed)]} : card)});
    write(SEPPUKU_UPDATE_KEY,true);
  }
}
const packagedFurnace=PACKAGED_DESIGN?.cards.find(card=>card.name===FURNACE_CARD_NAME);
const savedFurnace=design.cards.find(card=>card.name===FURNACE_CARD_NAME);
if(packagedFurnace && !read(FURNACE_UPDATE_KEY)){
  if(savedFurnace){
    const updated=updateFurnaceCard(savedFurnace);
    if(updated!==savedFurnace) saveDesign({...design,cards:design.cards.map(card=>card===savedFurnace?updated:card)});
    if(updated.effects.some(effect=>effect.type==='furnaceAspect')) write(FURNACE_UPDATE_KEY,true);
  } else if(design.cards.length<150 && design.cards.some(card=>card.id===SEPPUKU_CARD_ID)){
    saveDesign({...design,cards:[...design.cards,structuredClone(packagedFurnace)]});
    write(FURNACE_UPDATE_KEY,true);
  }
}
const savedVitality=design.cards.find(card=>card.id==='a8' && card.name===VITALITY_CARD_NAME);
if(savedVitality && !read(VITALITY_UPDATE_KEY)){
  const updated=updateVitalityCard(savedVitality);
  if(updated!==savedVitality) saveDesign({...design,cards:design.cards.map(card=>card===savedVitality?updated:card)});
  write(VITALITY_UPDATE_KEY,true);
}
const savedBloodJoy=design.cards.find(card=>card.id===BLOOD_JOY_CARD_ID);
if(savedBloodJoy && !read(BLOOD_JOY_UPDATE_KEY)){
  const updated=updateBloodJoyCard(savedBloodJoy);
  if(updated!==savedBloodJoy) saveDesign({...design,cards:design.cards.map(card=>card===savedBloodJoy?updated:card)});
  write(BLOOD_JOY_UPDATE_KEY,true);
}
render();
</script>
