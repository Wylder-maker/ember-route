<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="三幕制单人构筑卡牌游戏。设计角色和卡牌，带上你的牌组试打一局。">
  <title>余烬航线</title>
  <style>:root{font-family:"Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;color:#edf5ee;background:#0b1516;font-size:15px;line-height:1.55;--ink:#edf5ee;--muted:#a2b5b1;--subtle:#7f9692;--border:#314646;--panel:#142425;--accent:#e6c083;--teal:#9ed9cd;--red:#f4a08f}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-width:310px;background:radial-gradient(ellipse at 52% 12%,#172b2c 0%,#0b1516 68%) fixed}
button,input,select,textarea{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{cursor:default;opacity:.47}
:focus-visible{outline:2px solid #ffe2ab;outline-offset:4px}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.18}
h1{font-size:clamp(2.1rem,4vw,3.55rem);letter-spacing:-.045em}
h2{font-size:1.26rem}
h3{font-size:1.05rem}
p{color:var(--muted)}
ul,ol{margin:0}
.app{width:min(1184px,100% - 48px);margin:auto}
.masthead{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;font-weight:800;letter-spacing:.12em}
.brand-mark{display:grid;place-items:center;width:36px;aspect-ratio:1;border:1px solid #74978b;color:var(--accent);background:#19312e;font-size:21px;clip-path:polygon(0 0,80% 0,100% 20%,100% 100%,20% 100%,0 80%)}
.masthead nav,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nav-button,.tab,.text-button,.list-item{border:1px solid transparent;background:none;border-radius:6px;padding:8px 12px;color:var(--muted)}
.nav-button:hover,.tab:hover,.text-button:hover,.list-item:hover{color:var(--ink);background:#ffffff08}
.nav-button[aria-current="page"],.tab[aria-pressed="true"],.list-item[aria-pressed="true"]{border-color:#526c65;color:#e0efe7;background:#233937}
main{padding:26px 0 34px;min-height:calc(100vh - 144px)}
main:focus{outline:none}
footer{max-width:100%;padding:18px 0 28px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border-top:1px solid var(--border);color:var(--subtle);font-size:.8rem;letter-spacing:.08em}
.publication-note{flex-basis:100%;line-height:1.65;letter-spacing:normal}
.button{min-height:42px;border-radius:6px;border:1px solid #57716c;padding:8px 14px;background:transparent;color:var(--ink);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.primary{border-color:#e6c083;background:#e6c083;color:#22231e}
.primary:hover:not(:disabled){background:#ffe0a7}
.secondary:hover:not(:disabled){background:#34504c}
.quiet{border-color:transparent;color:#edaa9e}
.quiet:hover:not(:disabled){background:#653b35}
.text-button{font-size:.88rem}
.overline{color:var(--teal);font-weight:700;letter-spacing:.19em;font-size:.72rem}
.muted{color:var(--muted);font-size:.88rem}
.end{justify-content:flex-end;margin-top:20px}
.hero{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;min-height:390px;padding:clamp(25px,5vw,68px);border:1px solid #486861;border-radius:12px;background:radial-gradient(ellipse at 75% 51%,#41665b 0,#234542 29%,#172e30 57%,#132426 76%)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.3;background:repeating-linear-gradient(0deg,transparent 0 4px,#112b2c 5px 6px);pointer-events:none}
.hero-copy{max-width:475px;z-index:1}
.hero h1{font-size:clamp(3.1rem,7.25vw,6rem);line-height:.98;margin:12px 0 20px;text-shadow:0 2px 24px #10191a}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero-copy>p:not(.overline){max-width:320px;font-size:1rem;color:#d2e1d7;margin-bottom:20px}
.hero-art{position:absolute;right:0;top:0;bottom:0;width:61%;overflow:hidden;display:grid;place-items:center;z-index:-1}
.orbit,.orbit::before,.orbit::after{position:absolute;width:min(77%,430px);aspect-ratio:1;border:1px solid #b3e0cd38;border-radius:50%}
.orbit::before,.orbit::after{content:"";inset:8%;width:auto}
.orbit::after{inset:19%;border-style:dashed}
.star{width:54%;height:82%;background:linear-gradient(145deg,#d9e4aa 7%,#82c1a3 33%,#244648 83%);clip-path:polygon(50% 0,63% 25%,78% 31%,70% 48%,100% 62%,64% 64%,67% 88%,53% 78%,43% 100%,32% 73%,9% 69%,28% 54%,0 37%,34% 38%,29% 18%,46% 24%);opacity:.82}
.rift{position:absolute;inset:13% 20%;background:linear-gradient(155deg,#e7d997,#79b7a4 46%,#1c393d 83%);clip-path:polygon(48% 0,63% 30%,79% 38%,71% 50%,99% 68%,71% 69%,50% 100%,38% 64%,15% 49%,29% 33%)}
.rift::after{content:"";position:absolute;inset:9% 11%;background:linear-gradient(140deg,#e5e8ba,#75ac9b 38%,#416260 45%,#162c36 49%,#385558 100%);clip-path:polygon(48% 0,65% 31%,78% 45%,74% 56%,89% 69%,68% 66%,50% 100%,39% 62%,15% 46%,31% 29%)}
.hero-art>i{position:absolute;display:block;width:7px;aspect-ratio:1;background:#f2d58d;box-shadow:0 0 15px #f3e0a4;transform:rotate(45deg)}
.hero-art>i:nth-of-type(1){top:21%;left:19%}.hero-art>i:nth-of-type(2){top:72%;left:72%;width:11px}.hero-art>i:nth-of-type(3){top:31%;left:79%;width:5px}.hero-art>i:nth-of-type(4){top:79%;left:34%;width:4px}
.dispatch{display:grid;grid-template-columns:minmax(150px,.8fr) minmax(220px,1.25fr) auto;gap:22px;align-items:center;margin-top:16px;padding:20px 24px;border:1px solid var(--border);border-radius:10px;background:#152527}
.dispatch h2{margin-bottom:6px}
.dispatch p{font-size:.86rem}
.crew{min-width:0}
.crew>label{display:block;color:var(--subtle);font-size:.78rem;margin-bottom:4px}
.crew>.ascension-label{margin-top:12px}
.crew>select{width:100%;margin-bottom:6px}
.crew-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;color:var(--teal);font-size:.78rem}
.crew-stats>span,.relic-pill{border:1px solid #45615b;border-radius:4px;background:#223632;padding:3px 7px}
.run-header{border:1px solid var(--border);border-radius:10px;background:#112022;padding:12px 16px;margin-bottom:15px}
.run-meta{display:flex;gap:10px;justify-content:space-between;align-items:center}
.bullet{margin:0 8px;color:var(--subtle)}
.hp-text{color:#f3a597;font-variant-numeric:tabular-nums}
.run-tools{display:flex}
.route{display:grid;grid-template-columns:repeat(var(--route-steps,7),minmax(0,1fr));list-style:none;padding:9px 0 0;text-align:center;gap:4px}
.route li{display:grid;gap:3px;justify-items:center;color:#849997;font-size:.7rem;min-width:0;position:relative}
.route li:not(:first-child)::before{content:"";height:1px;position:absolute;right:calc(50% + 14px);left:calc(-50% + 10px);top:14px;background:#4b615a}
.route i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1px solid #4b615a;font-size:14px;line-height:1;font-style:normal}
.route .passed{color:#a9c4ba}.route .passed i{background:#294741;border-color:#537d6d}
.route .current{color:var(--accent);font-weight:700}.route .current i{color:#242518;background:var(--accent);border-color:var(--accent)}
.stage,.battle,.lab{border:1px solid var(--border);border-radius:11px;background:#152526;padding:clamp(14px,3.6vw,34px)}
.stage-head .overline,.battle-label .overline{margin-bottom:6px}
.stage-head h1,.lab-head h1{margin-bottom:9px}
.stage-head{margin-bottom:20px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px}
.card{--card-hue:#93cac2;display:flex;flex-direction:column;min-height:174px;min-width:0;align-items:center;text-align:center;padding:9px;border:1px solid #4f6d68;border-radius:7px;background:linear-gradient(165deg,#32514d,#172829 36%,#182323);color:var(--ink);gap:3px;font-size:inherit;overflow-wrap:anywhere}
.card.attack{--card-hue:#f0a48b;border-color:#815f53;background:linear-gradient(165deg,#5a3c32,#302623 36%,#251f1e)}
.card.power{--card-hue:#cdb8f2;border-color:#76668a;background:linear-gradient(165deg,#51446c,#2d253a 36%,#252031)}
.card.rare{box-shadow:inset 0 2px #d3ac73}
.card:hover:not(:disabled):is(button){border-color:var(--card-hue);transform:translateY(-2px)}
.card.chosen{outline:2px solid var(--accent);outline-offset:-2px;box-shadow:inset 0 0 18px #e6c08333}
.card-top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:3px}
.card-cost{font-weight:800;display:grid;place-items:center;background:var(--card-hue);color:#152123;font-variant-numeric:tabular-nums;width:23px;height:23px;border-radius:50%;font-size:.87rem}
.card-rarity,.card-kind{font-size:.69rem;color:var(--card-hue)}
.card-symbol{color:var(--card-hue);font-size:1.65rem;line-height:1.05;text-shadow:0 0 15px color-mix(in srgb,var(--card-hue),transparent 45%)}
.card-name{font-size:.91rem;font-weight:800}
.card-name em{color:var(--accent);font-style:normal}
.card-text{display:block;margin-top:4px;border-top:1px solid #ffffff24;padding:6px 0 0;width:100%;color:#d2d9d3;font-size:.74rem;line-height:1.45}
.card-text b{color:var(--ink)}
.card-keyword-text{display:inline-block;margin-top:4px;color:var(--card-hue);font-weight:700}
.battle{padding:0;overflow:hidden}
.battle-label{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.battle-label h1{font-size:1.52rem}
.turn{color:var(--accent);font-size:.86rem;border:1px solid #675942;padding:4px 8px;border-radius:5px}
.arena{min-height:207px;display:grid;grid-template-columns:minmax(105px,.85fr) minmax(0,1.15fr);align-items:end;gap:8px;padding:10px min(6vw,55px) 13px;border-block:1px solid #3e5250;background:radial-gradient(ellipse at 52% 82%,#42615577 0,transparent 57%),linear-gradient(149deg,#253f3f,#112124 70%);position:relative;isolation:isolate}
.arena::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.45;background:linear-gradient(160deg,transparent 0 31%,#526854 32%,transparent 33% 58%,#334c45 59%,transparent 60%),repeating-linear-gradient(94deg,#789b8e0f 0 20px,transparent 20px 44px);clip-path:polygon(0 0,100% 0,100% 84%,0 66%)}
.enemies{display:flex;gap:14px;justify-content:space-around;min-width:0}
.enemy-wrap{width:min(50%,160px);min-width:0}
.enemy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,110px),1fr));align-items:end;justify-items:center}
.enemy-grid .enemy-wrap{width:100%;max-width:160px}
.enemy-kind{color:var(--muted);font-size:.66rem}
.unit{display:grid;justify-items:center;align-content:end;width:min(100%,160px);gap:3px;border:1px solid transparent;padding:4px;border-radius:6px;background:transparent;text-align:center;min-width:0}
.player{justify-self:center}
.enemy{width:100%;height:100%;cursor:default}
.enemy.targetable{cursor:crosshair;border-style:dashed;border-color:#e6c08395;background:#e6c08313}
.enemy.targetable:hover,.enemy.targetable:focus-visible{background:#e6c08328;border-color:var(--accent)}
.enemy.fallen{opacity:.38}
.unit-title{font-size:.82rem;overflow-wrap:anywhere}
.intent{background:#293f43;color:#bfe8eb;border:1px solid #5c8181;border-radius:4px;padding:2px 5px;font-size:.73rem;text-align:center;line-height:1.35}
.intent.neutral{color:#bee1c9;border-color:#5f8071}.intent.danger{color:#ffcaba;background:#50342f;border-color:#9c655c}
.life{position:relative;isolation:isolate;overflow:hidden;width:100%;height:16px;border-radius:4px;background:#3b302f;border:1px solid #ab7266;text-align:center}
.life i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#80443c,#b45b4c);z-index:-1}
.life b{display:block;font-size:.66rem;line-height:14px;color:#fff6eb;font-variant-numeric:tabular-nums}
.statuses{min-height:20px;display:flex;justify-content:center;gap:3px;flex-wrap:wrap;font-size:.65rem;color:#e4dfc6}
.statuses span{background:#384237;border:1px solid #626b51;border-radius:4px;padding:1px 3px}
.statuses .bleed{background:#542d31;border-color:#9c5a62;color:#ffd2cc}
.statuses .frostbite{background:#28444d;border-color:#5b8e9e;color:#caf0fa}
.avatar-art,.enemy-art{position:relative;display:block;width:96px;max-width:100%;height:92px;filter:drop-shadow(0 0 12px #a3d9ab4d)}
.avatar-art::before{content:"";position:absolute;inset:0;background:linear-gradient(130deg,#b9e4bc 0,#568c78 45%,#274a49 47%,#18312f 84%);clip-path:polygon(50% 1%,74% 29%,71% 46%,84% 56%,99% 96%,1% 96%,16% 56%,29% 46%,26% 29%)}
.avatar-art i{position:absolute;inset:21% 32% 38%;background:linear-gradient(120deg,#ecdb99,#4e8d82 52%,#284d52 54%);clip-path:polygon(50% 0,100% 45%,60% 100%,0 70%)}
.enemy-art{--body:#9b5b65;--light:#e9ab92;--shadow:#3e2537;filter:drop-shadow(0 0 12px #ca99874d)}
.enemy-art::before{content:"";position:absolute;inset:5% 0;background:linear-gradient(141deg,var(--light),var(--body) 48%,var(--shadow) 49%,var(--body) 90%);clip-path:polygon(11% 23%,37% 26%,50% 4%,74% 27%,98% 25%,86% 56%,70% 67%,82% 98%,50% 82%,22% 98%,30% 67%,12% 57%)}
.enemy-art i{position:absolute;display:block;aspect-ratio:1;background:var(--light);border:2px solid var(--body);transform:rotate(45deg);width:20%;left:40%;top:33%;box-shadow:0 0 10px var(--light)}
.enemy-art i:nth-child(2){width:7%;left:27%;top:52%}.enemy-art i:nth-child(3){width:7%;left:66%;top:52%}
.moth{--body:#698168;--light:#d9cd8b;--shadow:#34504b}.moth::before{clip-path:polygon(1% 10%,37% 24%,50% 10%,63% 24%,99% 10%,93% 55%,72% 73%,49% 84%,27% 73%,7% 55%)}
.crawler{--body:#668892;--light:#b0dcc4;--shadow:#33394d}.crawler::before{clip-path:polygon(20% 39%,41% 16%,65% 18%,79% 38%,100% 83%,74% 71%,70% 93%,55% 74%,42% 94%,30% 70%,0 84%)}
.golem,.guard{--body:#526a9c;--light:#b4d8e5;--shadow:#303452}.golem::before,.guard::before{clip-path:polygon(50% 0,78% 19%,87% 37%,100% 70%,79% 89%,62% 80%,49% 100%,36% 80%,20% 89%,0 70%,13% 37%,22% 19%)}
.boss{--body:#8f668e;--light:#d7b0e0;--shadow:#352640;width:114px}.boss::before{clip-path:polygon(50% 0,63% 27%,90% 4%,82% 41%,100% 65%,78% 65%,82% 96%,62% 78%,50% 100%,37% 78%,18% 96%,22% 65%,0 65%,18% 41%,10% 4%,37% 27%)}
.battle-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--border)}
.resource{display:flex;align-items:center;gap:7px;font-size:.86rem;color:var(--accent)}
.resource b{font-size:1.3rem}
.energy-icon{display:grid;width:29px;aspect-ratio:1;place-items:center;border:1px solid #977746;border-radius:50%;background:#443c2a}
.piles{display:flex;flex-wrap:wrap}
.piles button{padding:6px}
.hand-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 8px}
.hand-head h2{font-size:1rem;flex:none}.hand-head h2 span{font-size:.78rem;color:var(--muted);margin-left:3px}
.hand-head p{font-size:.74rem;text-align:right}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:9px;padding:4px 16px 16px;min-height:115px}
.hand .card{min-height:134px}
.relic-strip{display:flex;flex-wrap:wrap;gap:6px;padding:9px 16px 12px;border-top:1px solid var(--border);font-size:.73rem;color:var(--teal)}
.deals,.relic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}
.deal,.relic{border:1px solid #53716b;border-radius:7px;padding:14px;display:grid;justify-items:start;align-content:start;gap:6px;background:#1e3332;text-align:left}
.deal:hover:not(:disabled){border-color:var(--accent);background:#2e4540}
.deal-icon,.relic>span{font-size:1.65rem;color:var(--accent);line-height:1}
.deal span:not(.deal-icon),.relic p,.deal small{font-size:.82rem;color:var(--muted)}
.deal small{color:var(--accent)}
.result{text-align:center}
.result .crew-stats,.result .actions{justify-content:center;margin-top:18px}
.result h1{margin:7px 0 9px}
.result-mark{font-size:3.2rem;color:var(--accent);line-height:1.2}
.lab-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:22px}
.lab-layout{display:grid;grid-template-columns:minmax(155px,195px) minmax(0,1fr);gap:21px}
.lab-sidebar{padding-right:14px;border-right:1px solid var(--border)}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{padding-inline:8px}
.item-list{display:grid;gap:4px;margin:10px 0;max-height:440px;overflow:auto;padding:4px}
.list-item{text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px;overflow-wrap:anywhere}
.list-item small{color:var(--subtle);white-space:nowrap}
.editor{min-width:0}
.editor h2{margin:5px 0 15px}
.editor h3{margin:17px 0 5px}
.field{display:grid;gap:4px;color:var(--muted);font-size:.82rem;margin:0 0 10px;min-width:0}
.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px}
.enemy-intent-list{display:grid;gap:6px;margin:10px 0}
.enemy-intent-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(65px,.7fr) auto auto;align-items:center;gap:8px}
.enemy-intent-row .field{margin-bottom:0}
.enemy-intent-row .close{justify-self:end}
.enemy-advanced,.enemy-spawns fieldset{min-width:0;margin:8px 0 0;padding:8px;border:1px solid var(--border);border-radius:6px}
.enemy-spawns{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.enemy-spawns legend{padding-inline:4px;color:var(--teal);font-size:.82rem}
.enemy-spawns input{width:100%}
input:not([type="checkbox"]),select,textarea{min-width:0;min-height:36px;border-radius:5px;border:1px solid #57716c;background:#102022;color:var(--ink);padding:5px 8px}
input[type="checkbox"]{accent-color:var(--accent);width:17px;height:17px;margin:0}
textarea{resize:vertical}
.check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.82rem}
.card-keywords{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px}
.deck-table{overflow:auto;margin-top:9px;max-height:360px;border:1px solid var(--border);border-radius:6px}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 9px;text-align:left;border-bottom:1px solid var(--border);font-size:.8rem}
thead th{position:sticky;top:0;background:#29413e;z-index:1}
tbody th{font-weight:600}
th small{display:block;color:var(--subtle);font-weight:400}
td input[type="number"]{width:62px}
.effects{display:grid;gap:5px;margin:10px 0}
.effect-row{display:grid;grid-template-columns:1.2fr .8fr .85fr .65fr .95fr 1.1fr auto;gap:7px;align-items:end}
.effect-row .close{margin-bottom:10px}
.effect-hits,.effect-upgrade-hits,.effect-timing{min-width:0}
.effect-target{grid-column:1 / 3;grid-row:2;min-width:0}
.effect-growth{grid-column:3 / 5;grid-row:2;min-width:0}
.effect-status{grid-column:1 / -1;grid-row:3;min-width:0}
.effect-status,.status-trigger-fields{margin:0 0 8px;padding:8px 10px 0;border:1px solid var(--border);border-radius:6px}
.effect-status legend{padding:0 4px;color:var(--muted);font-size:.78rem}
.statuses .custom-status{border-color:#8c77a6;background:#433752;color:#efddff}
#power-editor-help{margin-top:7px}
.card-preview{display:grid;grid-template-columns:repeat(auto-fit,155px);gap:8px;margin:14px 0 0}
.form-message{font-size:.86rem;color:#f5a795;margin-top:10px}
dialog{width:min(680px,100% - 24px);max-height:85dvh;overflow:auto;border:1px solid #617d79;border-radius:12px;background:#152526;color:var(--ink);padding:0;box-shadow:0 20px 80px #0008}
dialog::backdrop{background:#050b0bce}
.dialog-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding:12px 17px;background:#1b2e30}
.dialog-body{padding:15px 17px 20px}
.close{font-size:1.28rem;padding:1px 9px}
.rule-list{padding-left:20px;color:var(--muted);display:grid;gap:8px}
.rule-list b{color:var(--ink)}

  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <script>const KINDS = {attack:'攻击', skill:'技能', power:'能力'};
const RARITIES = {common:'普通', uncommon:'罕见', rare:'稀有'};
const TARGETS = {single:'敌人（单体）', self:'自己', all:'敌方全体'};
const HAND_LIMIT = 10;
const MAX_EFFECT_HITS = 10;
const MAX_EFFECT_AMOUNT = 99;
const COMBO_DAMAGE_SEGMENTS = 6;
const COMBO_CARD_ID = '31ddd293-92e7-47f8-905e-ee884bdcf5c7';
const SEPPUKU_CARD_ID = '6b8e97b8-10c6-416b-8115-b20518ed805a';
const FURNACE_CARD_NAME = '熔炉百相之兽';
const FURNACE_TEMP_HP = 20;
const FURNACE_ATTACK_BONUS = 1;
const FURNACE_END_DAMAGE = 15;
const DEFAULT_FURNACE_TURNS = 2;
const VITALITY_CARD_NAME = '活性';
const VITALITY_REGENERATION = 3;
const BLOOD_JOY_CARD_ID = 'ba1376f3-408a-49c9-8b55-e4717f16f4d8';
const AILMENTS = {
  bleed:{name:'出血',threshold:3,damage:20,vulnerable:0},
  frostbite:{name:'冻伤',threshold:3,damage:15,vulnerable:2},
};
const EFFECTS = {
  damage:'伤害', block:'格挡', draw:'抽牌', energy:'能量', heal:'回复生命', strength:'力量',
  vigor:'活力', dexterity:'敏捷',
  regeneration:'再生',
  bleedBlock:'出血引爆时获得格挡（能力）',
  furnaceAspect:'熔炉百相之兽增益',
  comboEnergy:'每 '+COMBO_DAMAGE_SEGMENTS+' 段伤害回能（能力）',
  weak:'虚弱', vulnerable:'易伤', bleed:AILMENTS.bleed.name, frostbite:AILMENTS.frostbite.name,
  status:'施加自定义状态',
};
const HOSTILE = ['damage','weak','vulnerable',...Object.keys(AILMENTS)];
const STATUS_TRIGGERS = {none:'仅记录层数',card:'打出指定牌型',attack:'强化接下来几段攻击',attackBleed:'打出攻击牌施加出血'};
const STATUS_REWARDS = {block:'格挡',heal:'生命',strength:'力量',draw:'抽牌',energy:'能量'};
const GROWTH_EFFECTS = ['damage','block','energy','heal','strength'];
const MAX_POWER_GROWTH = 99;
const ACT_COUNT = 3;
const ACT_HEAL_PERCENT = 80;
const MAX_ASCENSION = 5;
const BASE_MERCHANT_LIMIT = 3;
const BATTLE_REWARD_SIZE = 3;
const BATTLE_REWARD_ODDS = [['rare',10],['uncommon',40],['common',50]];
const ENEMY_KINDS = {normal:'普通敌人',elite:'精英敌人',boss:'首领敌人'};
const ENEMY_ACTIONS = {attack:'攻击',guard:'格挡',fortify:'格挡并获得 2 力量',weak:'施加虚弱',weaken:'攻击并施加 1 虚弱',vulnerable:'施加易伤'};
const ENEMY_SHAPES = ['scout','moth','crawler','golem','guard','boss'];
const MAX_ENEMY_TURNS = 30;
const MAX_ENEMY_COPIES = 20;
const ROOMS = [
  {type:'combat', name:'断桥哨口', icon:'⚔'},
  {type:'combat', name:'黑潮浅滩', icon:'⚔'},
  {type:'merchant', name:'漂流商站', icon:'◇'},
  {type:'combat', name:'水晶回廊', icon:'⚔'},
  {type:'chest', name:'密封货舱', icon:'▣'},
  {type:'combat', name:'守门者', icon:'⚔'},
  {type:'boss', name:'黑潮核心', icon:'✷'},
];
const RUN_BATTLE_COUNT = ACT_COUNT * ROOMS.filter(room=>room.type==='combat' || room.type==='boss').length;
const EXTRA_BOSS_ROOMS = [...ROOMS,{type:'boss',name:'黑潮核心再战',icon:'✷'}];
function roomsForAct(run) {
  return run.ascension>=5 && run.act===ACT_COUNT ? EXTRA_BOSS_ROOMS : ROOMS;
}
function combatNodes(act) {
  return roomsForAct({act,ascension:MAX_ASCENSION}).flatMap((room,index)=>
    room.type==='combat'||room.type==='boss'?[{...room,node:index+1}]:[]);
}
function runBattleCount(run) {
  return RUN_BATTLE_COUNT + Number(run.ascension>=5);
}
function startingHp(maxHp,ascension) {
  return ascension>=1 ? Math.floor(maxHp*80/100) : maxHp;
}
function merchantLimit(run) {
  return BASE_MERCHANT_LIMIT - Number(run.ascension>=3);
}
const STATUSES = {weak:'虚弱', vulnerable:'易伤'};
const RELICS = [
  {id:'beacon', name:'余火灯标', icon:'✴', text:'每次战斗开始时获得 6 格挡。'},
  {id:'gyro', name:'铜制陀螺', icon:'◈', text:'每次战斗的首回合多获得 1 能量。'},
  {id:'logbook', name:'涂改航海图', icon:'⌘', text:'每次战斗的首回合多抽 1 张牌。'},
  {id:'ember', name:'灼热炉芯', icon:'✹', text:'每次战斗开始时获得 1 力量。'},
  {id:'salve', name:'盐雾药瓶', icon:'✚', text:'每场战斗获胜后回复 4 点生命。'},
  {id:'seal', name:'蜡封徽章', icon:'⊕', text:'拾取时增加 7 点生命上限，并回复 7 点生命。'},
];
const FOES = {
  0:[['锈壳斥候',31,'scout',[['attack',7],['guard',6],['attack',10]]]],
  1:[['盐雾飞虱',20,'moth',[['attack',5],['attack',8],['guard',5]]],['盐滩拟形虫',23,'crawler',[['guard',5],['attack',8],['attack',6]]]],
  3:[['辉晶棱兽',51,'golem',[['attack',11],['fortify',8],['attack',15],['weak',2]]]],
  5:[['沉钟执役',44,'guard',[['attack',10],['fortify',6],['attack',17]]],['警戒孢球',22,'moth',[['guard',5],['attack',7],['weaken',5]]]],
  6:[['黑潮核心',101,'boss',[['attack',14],['fortify',12],['weaken',13],['attack',22],['vulnerable',2]]]],
};

function defaultEnemyDesigns() {
  return Object.entries(FOES).flatMap(([room,foes])=>foes.map(([name,hp,shape,pattern],index)=>{
    const node=Number(room)+1;
    const kind=shape==='boss'?'boss':shape==='guard'?'elite':'normal';
    const spawns=Array.from({length:ACT_COUNT},(_,i)=>({act:i+1,node,count:1}));
    if(kind==='boss') spawns.push({act:ACT_COUNT,node:EXTRA_BOSS_ROOMS.length,count:1});
    return {id:'foe-'+node+'-'+(index+1),name,kind,hp,shape,intents:{turns:structuredClone(pattern),loop:[]},spawns};
  }));
}

function enemiesAtNode(enemies,act,node) {
  const roster=[];
  for(const enemy of enemies){
    const spawn=enemy.spawns.find(entry=>entry.act===act && entry.node===node);
    if(spawn){
      for(let copy=0;copy<spawn.count;copy++) roster.push(enemy);
    }
  }
  return roster;
}

function sampleDesign() {
  const card = (id,name,kind,cost,effects,rarity='common',target='single') => ({
    id,name,kind,cost,rarity,target,effects:effects.map(([type,amount,upgrade])=>({type,amount,upgrade}))
  });
  const cards = [
    card('jolt','火花突刺','attack',1,[['damage',6,3]]),
    card('brace','横臂格挡','skill',1,[['block',6,3]]),
    card('flare','照明焰','attack',1,[['damage',8,3],['vulnerable',1,1]]),
    card('a1','磁弧扫掠','attack',1,[['damage',7,3]],'common','all'),
    card('a2','破窗锤','attack',2,[['damage',18,5]]),
    card('a3','回火','attack',0,[['damage',4,2]]),
    card('a4','卸力回身','skill',1,[['block',8,3],['draw',1,0]]),
    card('a5','应急绷带','skill',1,[['heal',5,2]],'common'),
    card('a6','夹层线路','skill',0,[['draw',2,1]],'common'),
    card('a7','偏转波','skill',1,[['block',8,2],['weak',2,1]],'uncommon','all'),
    card('a8','热启动','power',1,[['strength',2,1]],'uncommon'),
    card('a9','夹击协议','attack',1,[['damage',11,4],['weak',1,1]],'uncommon'),
    card('b1','逆向充电','skill',0,[['energy',1,1],['draw',1,0]],'uncommon'),
    card('b2','熔流贯穿','attack',2,[['damage',18,6],['vulnerable',2,1]],'rare','all'),
    card('b3','深海反应堆','power',1,[['strength',4,2],['block',8,4]],'rare'),
  ];
  cards.find(c=>c.id==='a5').exhaust = true;
  return {version:1, cards, heroes:[{
    id:'sample', name:'拾火者', description:'用应急工具和失落技术穿过封锁线。示例角色，可在工坊里编辑。',
    hp:68, energy:3, draw:5, deck:[{id:'jolt',count:4},{id:'brace',count:4},{id:'flare',count:1}],
    pool:cards.slice(3).map(c=>c.id)
  }]};
}

function shuffle(items, random=Math.random) {
  const result = [...items];
  for(let i=result.length-1;i>0;i--){
    const j = Math.floor(random()*(i+1));
    [result[i],result[j]] = [result[j],result[i]];
  }
  return result;
}

function offerCards(run, limit) {
  const available = run.design.cards.filter(card=>run.hero.pool.includes(card.id));
  const byRarity = Object.fromEntries(Object.keys(RARITIES).map(r=>[r,shuffle(available.filter(c=>c.rarity===r))]));
  const picks = [];
  while(picks.length<limit && Object.values(byRarity).some(list=>list.length)){
    const bid = Math.random();
    const order = bid<.55 ? ['common','uncommon','rare'] : bid<.95 ? ['uncommon','common','rare'] : ['rare','uncommon','common'];
    const bucket = order.find(r=>byRarity[r].length);
    picks.push(byRarity[bucket].pop().id);
  }
  return picks;
}

function offerBattleRewards(run, boss=false, random=Math.random) {
  const pool=new Set(run.hero.pool);
  const odds=boss?[['rare',100]]:BATTLE_REWARD_ODDS;
  const buckets=Object.fromEntries(odds.map(([rarity])=>{
    const cards=run.design.cards.filter(card=>card.rarity===rarity);
    const reserve=shuffle(cards.filter(card=>!pool.has(card.id)),random);
    const preferred=shuffle(cards.filter(card=>pool.has(card.id)),random);
    return [rarity,[...reserve,...preferred]];
  }));
  const picks=[];
  while(picks.length<BATTLE_REWARD_SIZE){
    const available=odds.filter(([rarity])=>buckets[rarity].length);
    const weight=available.reduce((sum,[,chance])=>sum+chance,0);
    if(!weight) break;
    let roll=Math.floor(random()*weight);
    for(const [rarity,chance] of available){
      if(roll<chance){
        picks.push(buckets[rarity].pop().id);
        break;
      }
      roll-=chance;
    }
  }
  return picks;
}

function newRun(design, heroId, ascension=0) {
  const snapshot = structuredClone(design);
  const hero = snapshot.heroes.find(h=>h.id===heroId);
  const hp = startingHp(hero.hp,ascension);
  const run = {design:snapshot, hero, hp, maxHp:hero.hp, ascension, act:1, room:-1, deck:[], relics:[], view:hp>0?'draft':'defeat', nextUid:0, rounds:0, wins:0};
  for(const entry of hero.deck){
    for(let i=0;i<entry.count;i++) addCard(run,entry.id);
  }
  run.options = offerCards(run,10);
  run.picks = [];
  return run;
}

function addCard(run,id) {
  run.deck.push({id, uid:++run.nextUid, upgraded:false});
}
function amountOf(effect,entry={}) {
  return effect.amount + (entry.upgraded ? effect.upgrade : 0);
}
function hitsOf(effect,entry={}) {
  return (effect.hits ?? 1) + (entry.upgraded ? (effect.upgradeHits ?? 0) : 0);
}
function canGrowEffect(kind,type) {
  return kind==='power' && GROWTH_EFFECTS.includes(type);
}
function powerAmount(buff,activations=buff.activations) {
  return amountOf(buff.effect,buff.entry) + (buff.effect.growth ?? 0)*activations;
}
function cardCost(card,entry={}) {
  return Math.max(0,card.cost-(entry.upgraded ? (card.upgradeCostReduction ?? 0) : 0));
}
function hasCardKeyword(card,entry,keyword) {
  return Boolean(entry.upgraded && card[keyword]);
}
function canUpgrade(card) {
  return Boolean(card.innate || card.retain || cardCost(card,{upgraded:true})<card.cost ||
    card.effects.some(effect=>effect.upgrade!==0 || effect.upgradeHits>0));
}
function getCard(run,entry) {
  return run.design.cards.find(c=>c.id===entry.id);
}
function returnOverflowToDraw(battle) {
  if(battle.hand.length<=HAND_LIMIT) return;
  // The draw pile is read from the end, so preserve the overflow's hand order in reverse.
  battle.draw.push(...battle.hand.splice(HAND_LIMIT).reverse());
}
function drawCards(battle,count) {
  for(let i=0;i<count && battle.hand.length<HAND_LIMIT;i++){
    if(!battle.draw.length){
      if(!battle.discard.length) return;
      battle.draw = shuffle(battle.discard);
      battle.discard = [];
    }
    battle.hand.push(battle.draw.pop());
  }
}
function hasRelic(run,id) { return run.relics.includes(id); }
function changeHp(run,value) {
  const previous = run.hp;
  run.hp = Math.max(0,Math.min(run.maxHp,previous+value));
  return run.hp-previous;
}
function actRecovery(run) {
  return Math.floor((run.maxHp-run.hp)*ACT_HEAL_PERCENT/100);
}
function log(run,message) {
  run.battle.log.unshift(message);
  run.battle.log = run.battle.log.slice(0,18);
}
function beginCombat(run) {
  const node=run.room+1;
  const configured=enemiesAtNode(run.design.enemies??[],run.act,node);
  const roster=configured.length?configured:enemiesAtNode(defaultEnemyDesigns(),run.act,node);
  const enemies=roster.map(({name,hp:baseHp,kind,shape,intents,advanced})=>{
    const hp=run.ascension>=2 ? Math.round(baseHp*110/100) : baseHp;
    const plan=run.ascension>=4 && advanced ? advanced : intents;
    return {name,hp,maxHp:hp,kind,shape:shape??(kind==='boss'?'boss':kind==='elite'?'guard':'scout'),pattern:plan.turns,loop:plan.loop,step:0,block:0,strength:0,weak:0,vulnerable:0};
  });
  const hand = [];
  const draw = [];
  for(const entry of shuffle(run.deck)){
    (hasCardKeyword(getCard(run,entry),entry,'innate') ? hand : draw).push(entry);
  }
  run.battle = {
    turn:1, energy:run.hero.energy + Number(hasRelic(run,'gyro')),
    block:hasRelic(run,'beacon') ? 6 : 0, strength:Number(hasRelic(run,'ember')), vigor:0, dexterity:0,
    weak:0,vulnerable:0, hand,draw,discard:[],exhaust:[],enemies,log:[],pending:[],buffs:[],
  };
  returnOverflowToDraw(run.battle);
  run.rounds++;
  const openingSize = run.hero.draw + Number(hasRelic(run,'logbook'));
  drawCards(run.battle,openingSize-hand.length);
  log(run,'第 1 回合开始。');
  run.view = 'combat';
}
function advance(run) {
  if(run.view==='boss-reward'){
    run.options=[];
    run.view='act-clear';
    return;
  }
  const enteringAct = run.view==='act-clear';
  let recovered = 0;
  if(enteringAct){
    if(run.act>=ACT_COUNT) return;
    run.act++;
    run.room=0;
    recovered=changeHp(run,actRecovery(run));
  } else {
    if(run.room>=roomsForAct(run).length-1) return;
    run.room++;
  }
  delete run.battle;
  const room = roomsForAct(run)[run.room];
  if(room.type==='merchant'){
    run.view='merchant';
    run.taken=[];
    run.merchantCards=offerCards(run,3);
    return;
  }
  if(room.type==='chest'){
    run.view='chest';
    run.chest = shuffle(RELICS.filter(r=>!hasRelic(run,r.id))).slice(0,2).map(r=>r.id);
    return;
  }
  beginCombat(run);
  if(enteringAct) log(run,'进入第 '+run.act+' 幕，回复 '+recovered+' 点生命。');
}
function gainRelic(run,id) {
  if(!id || hasRelic(run,id)) return;
  run.relics.push(id);
  if(id==='seal'){ run.maxHp+=7; changeHp(run,7); }
}
function scaledDamage(base,attacker,defender,attack=true) {
  let amount = base + (attack ? attacker.strength : 0);
  if(attack && attacker.weak>0) amount *= .75;
  if(defender.vulnerable>0) amount *= 1.5;
  return Math.max(0,Math.floor(amount));
}
function strike(defender,amount,bypassBlock=false) {
  const blocked = bypassBlock ? 0 : Math.min(defender.block,amount);
  defender.block -= blocked;
  const lost = Math.min(defender.hp,amount-blocked);
  defender.hp -= lost;
  return lost;
}
function targetHp(run,target) {
  return target===run.battle ? run.hp : target.hp;
}
function targetName(run,target) {
  return target===run.battle ? run.hero.name : target.name;
}
function changeTargetHp(run,target,value) {
  if(target===run.battle) return changeHp(run,value);
  const previous = target.hp;
  target.hp = Math.max(0,Math.min(target.maxHp,previous+value));
  return target.hp-previous;
}
function strikeTarget(run,target,amount,bypassBlock=false) {
  if(target!==run.battle) return strike(target,amount,bypassBlock);
  const blocked = bypassBlock ? 0 : Math.min(target.block,amount);
  target.block-=blocked;
  let damage = amount-blocked;
  for(const aspect of target.furnaceAspects ?? []){
    const absorbed = Math.min(aspect.hp,damage);
    aspect.hp-=absorbed;
    damage-=absorbed;
    if(damage===0) break;
  }
  const previous = run.hp;
  changeHp(run,-damage);
  return previous-run.hp;
}
function addFurnaceAspect(run,turns) {
  if(turns<=0) return;
  (run.battle.furnaceAspects ??= []).push({turns,hp:FURNACE_TEMP_HP});
  log(run,'「'+FURNACE_CARD_NAME+'」生效，获得 '+FURNACE_TEMP_HP+' 点临时生命，持续 '+turns+' 回合。');
}
function tickFurnaceAspects(run) {
  const battle = run.battle;
  if(!battle.furnaceAspects?.length) return;
  const active = battle.furnaceAspects;
  battle.furnaceAspects=active.filter(aspect=>--aspect.turns>0);
  for(const aspect of active){
    if(aspect.turns>0) continue;
    const targets=battle.enemies.filter(foe=>foe.hp>0);
    if(!targets.length) break;
    log(run,'「'+FURNACE_CARD_NAME+'」结束，对敌方全体造成 '+FURNACE_END_DAMAGE+' 点伤害。');
    resolveEffectSegment(run,'status','damage',FURNACE_END_DAMAGE,targets,'');
  }
}
function addCustomStatus(run,actor,rule,layers) {
  const key = JSON.stringify([rule.name,rule.decay,rule.keepNegative,rule.trigger,
    rule.cardKind,rule.rewardType,rule.rewardAmount,rule.attackHits,rule.attackBonus,rule.bleedAmount]);
  const statuses = actor.customStatuses ??= [];
  const existing = statuses.find(item=>item.key===key);
  if(!existing && layers<=0 && !rule.keepNegative) return;
  let status = existing;
  if(!status){
    status={key,rule,layers:0,hitsLeft:0};
    statuses.push(status);
  }
  const previous = status.layers;
  status.layers=rule.keepNegative ? previous+layers : Math.max(0,previous+layers);
  if(rule.trigger==='attack' && (!existing || layers>0)) status.hitsLeft+=rule.attackHits;
  if(!rule.keepNegative && status.layers===0) actor.customStatuses=statuses.filter(item=>item!==status);
  log(run,targetName(run,actor)+(layers<0?'减少':'获得')+'「'+rule.name+'」'+Math.abs(status.layers-previous)+' 层，总层数 '+status.layers+'。');
}
function decayCustomStatuses(actor) {
  if(!actor.customStatuses) return;
  actor.customStatuses=actor.customStatuses.filter(status=>{
    status.layers-=status.rule.decay;
    return status.rule.keepNegative || status.layers>0;
  });
}
function attackStatusBonus(actor,consume=false) {
  let bonus=0;
  for(const status of actor.customStatuses ?? []){
    if(status.rule.trigger!=='attack' || status.hitsLeft<=0) continue;
    bonus+=status.layers*status.rule.attackBonus;
    if(consume) status.hitsLeft--;
  }
  return bonus;
}
function cardStatusRewards(battle,kind) {
  return [battle,...battle.enemies].flatMap(actor=>(actor.customStatuses??[])
    .filter(status=>status.rule.trigger==='card' && status.rule.cardKind===kind)
    .map(({rule,layers})=>({actor,rule,amount:layers*rule.rewardAmount})));
}
function recordDamageSegments(run,count) {
  const b = run.battle;
  for(const buff of b.buffs ?? []){
    if(buff.effect.type!=='comboEnergy' || !buff.activations) continue;
    const total = (buff.damageSegments ?? 0)+count;
    const triggers = Math.floor(total/COMBO_DAMAGE_SEGMENTS);
    buff.damageSegments=total%COMBO_DAMAGE_SEGMENTS;
    if(triggers>0){
      const energy = triggers*powerAmount(buff,0)*hitsOf(buff.effect,buff.entry);
      b.energy=Math.max(0,b.energy+energy);
      log(run,'「'+getCard(run,buff.entry).name+'」触发 '+triggers+' 次，能量 '+(energy>=0?'+':'')+energy+'。');
    }
  }
}
function grantBleedBlock(run,bursts) {
  const battle = run.battle;
  for(const buff of battle.buffs ?? []){
    if(buff.effect.type!=='bleedBlock' || !buff.activations) continue;
    const block = bursts*amountOf(buff.effect,buff.entry)*hitsOf(buff.effect,buff.entry);
    resolveEffectSegment(run,'status','block',block,[battle],'');
    log(run,'「'+getCard(run,buff.entry).name+'」触发 '+bursts+' 次，格挡 '+(block>=0?'+':'')+block+'。');
  }
}
function applyAilment(run,foe,type,amount) {
  const {name,threshold,damage,vulnerable} = AILMENTS[type];
  const recipient = targetName(run,foe);
  const total = Math.max(0,(foe[type] ?? 0) + amount);
  const bursts = Math.floor(total/threshold);
  foe[type] = total % threshold;
  if(bursts===0){
    log(run,recipient+'的'+name+'累计至 '+foe[type]+' / '+threshold+' 层。');
    return;
  }
  const lost = strikeTarget(run,foe,bursts*damage,true);
  log(run,recipient+'的'+name+'引爆 '+bursts+' 次，失去 '+lost+' 点生命。');
  if(type==='bleed') grantBleedBlock(run,bursts);
  if(foe!==run.battle && lost>0) recordDamageSegments(run,Math.ceil(lost/damage));
  if(vulnerable>0 && targetHp(run,foe)>0){
    foe.vulnerable += bursts*vulnerable;
    log(run,recipient+'获得 '+(bursts*vulnerable)+' 回合易伤。');
  }
}
function resolveEffect(run,card,entry,effect,targets,{amount=amountOf(effect,entry),vigor=0}={}) {
  if(amount===0) return;
  const hits = hitsOf(effect,entry);
  for(let hit=1;hit<=hits && run.hp>0;hit++){
    const segment = hits>1 ? '（第 '+hit+' / '+hits+' 段）' : '';
    if(effect.type==='status'){
      for(const target of targets) if(targetHp(run,target)>0) addCustomStatus(run,target,effect.status,amount);
    } else resolveEffectSegment(run,card.kind,effect.type,amount,targets,segment,vigor);
  }
}
function resolveEffectSegment(run,kind,type,amount,targets,segment,vigor=0) {
  const b = run.battle;
  switch(type){
    case 'damage': {
      const attack = kind==='attack';
      const bonus = attack && amount>0 && targets.some(target=>targetHp(run,target)>0)
        ? vigor+attackStatusBonus(b,true)+(b.furnaceAspects?.length??0)*FURNACE_ATTACK_BONUS : 0;
      let damagedEnemy = false;
      for(const target of targets){
        if(targetHp(run,target)===0) continue;
        const recipient = targetName(run,target);
        if(amount<0){
          const recovered = changeTargetHp(run,target,-amount);
          log(run,recipient+'回复 '+recovered+' 点生命'+segment+'。');
          continue;
        }
        const lost = strikeTarget(run,target,scaledDamage(amount+bonus,b,target,attack));
        if(target!==b && lost>0) damagedEnemy=true;
        log(run,recipient+'损失 '+lost+' 点生命'+segment+'。');
      }
      if(damagedEnemy) recordDamageSegments(run,1);
      break;
    }
    case 'block': {
      const dexterityApplies = amount>0 && (kind==='attack' || kind==='skill');
      for(const target of targets){
        if(targetHp(run,target)===0) continue;
        const change = dexterityApplies && target===b ? Math.max(0,amount+(b.dexterity??0)) : amount;
        target.block=Math.max(0,target.block+change);
      }
      break;
    }
    case 'draw':
      if(amount<0) b.discard.push(...b.hand.splice(Math.max(0,b.hand.length+amount)));
      else drawCards(b,amount);
      break;
    case 'energy': b.energy=Math.max(0,b.energy+amount); break;
    case 'regeneration': b.regeneration=Math.max(0,(b.regeneration??0)+amount); break;
    case 'furnaceAspect': addFurnaceAspect(run,amount); break;
    case 'heal':
      for(const target of targets){
        if(targetHp(run,target)===0) continue;
        const change = changeTargetHp(run,target,amount);
        if(change<0) log(run,targetName(run,target)+'失去 '+(-change)+' 点生命'+segment+'。');
      }
      break;
    case 'strength':
      for(const target of targets) if(targetHp(run,target)>0) target.strength+=amount;
      break;
    case 'vigor':
    case 'dexterity':
      b[type]=(b[type]??0)+amount;
      break;
    case 'weak':
    case 'vulnerable':
      for(const target of targets) if(targetHp(run,target)>0) target[type]=Math.max(0,target[type]+amount);
      break;
    case 'bleed':
    case 'frostbite':
      for(const target of targets) if(targetHp(run,target)>0) applyAilment(run,target,type,amount);
      break;
  }
}
function requiresTarget(card) {
  return card.effects.some(effect=>effectTarget(card,effect)==='single');
}
function onlySelfTarget(type) {
  return type==='draw' || type==='energy' || type==='vigor' || type==='dexterity' || type==='comboEnergy' ||
    type==='furnaceAspect' || type==='regeneration' || type==='bleedBlock';
}
function effectTarget(card,effect) {
  return effect.target ?? (HOSTILE.includes(effect.type) ? (card.target ?? 'single') : 'self');
}
function updateFurnaceCard(card) {
  if(card.effects.some(effect=>effect.type==='furnaceAspect')) return card;
  const placeholders=card.effects.filter(effect=>effect.type==='status' && effectTarget(card,effect)==='self' &&
    effect.status.decay>0 && !effect.status.keepNegative && effect.amount>0);
  const placeholder=placeholders.find(effect=>effect.status.name===FURNACE_CARD_NAME) ??
    (placeholders.length===1 ? placeholders[0] : null);
  const furnace={type:'furnaceAspect',target:'self',amount:DEFAULT_FURNACE_TURNS,upgrade:0,nextTurn:false};
  if(placeholder){
    const duration=entry=>Math.min(MAX_EFFECT_AMOUNT,Math.max(1,
      Math.ceil(amountOf(placeholder,entry)*hitsOf(placeholder,entry)/placeholder.status.decay)));
    furnace.amount=duration({});
    furnace.upgrade=duration({upgraded:true})-furnace.amount;
    furnace.nextTurn=placeholder.nextTurn??false;
    return {...card,effects:card.effects.map(effect=>effect===placeholder ? furnace : effect)};
  }
  return card.effects.length<6 ? {...card,effects:[...card.effects,furnace]} : card;
}
function updateVitalityCard(card) {
  if(card.effects.some(effect=>effect.type==='regeneration')) return card;
  return {...card,effects:[{type:'regeneration',target:'self',amount:VITALITY_REGENERATION,upgrade:0,nextTurn:false}]};
}
function updateBloodJoyCard(card) {
  if(card.effects.some(effect=>effect.type==='bleedBlock')) return card;
  return {...card,effects:[{type:'bleedBlock',target:'self',amount:6,upgrade:2,nextTurn:false}]};
}
function targetsFor(battle,card,effect,enemyIndex,retarget=false) {
  const mode = effectTarget(card,effect);
  if(mode==='self') return [battle];
  if(mode==='all') return battle.enemies.filter(foe=>foe.hp>0);
  const target = battle.enemies[enemyIndex];
  if(target?.hp>0) return [target];
  const fallback = retarget ? battle.enemies.find(foe=>foe.hp>0) : null;
  return fallback ? [fallback] : [];
}
function triggerPowerBuff(run,card,buff) {
  const b = run.battle;
  const {entry,effect,enemyIndex} = buff;
  if(effect.type==='comboEnergy' || effect.type==='bleedBlock'){
    buff.activations=1;
    return;
  }
  const amount = powerAmount(buff);
  const targets = targetsFor(b,card,effect,enemyIndex,true);
  // Growing Strength replaces its previous contribution. Fixed gains stack as usual.
  let change = amount;
  if(effect.type==='strength' && effect.growth){
    const single = effectTarget(card,effect)==='single';
    const index = single ? b.enemies.indexOf(targets[0]) : null;
    if(buff.activations>0 && (!single || buff.strengthTarget===index)) change=effect.growth;
    if(single) buff.strengthTarget=index;
  }
  log(run,'「'+card.name+'」的'+EFFECTS[effect.type]+'生效，每段数值 '+amount+'。');
  resolveEffect(run,card,entry,effect,targets,{amount:change});
  buff.activations++;
}
function settleBattle(run) {
  if(run.view!=='combat') return;
  if(run.hp===0){
    run.view='defeat';
  } else if(run.battle.enemies.every(foe=>foe.hp===0)){
    run.wins++;
    if(hasRelic(run,'salve')) changeHp(run,4);
    const rooms=roomsForAct(run);
    if(rooms[run.room].type==='boss'){
      if(run.act<ACT_COUNT){
        run.options=offerBattleRewards(run,true);
        run.view='boss-reward';
      } else {
        run.options=[];
        run.view=run.room<rooms.length-1?'boss-clear':'victory';
      }
    } else {
      run.options=offerBattleRewards(run);
      run.view='reward';
    }
  }
}
function playCard(run,uid,enemyIndex) {
  if(run.view!=='combat') return false;
  const b = run.battle;
  const index = b.hand.findIndex(entry=>entry.uid===uid);
  if(index===-1) return false;
  const entry = b.hand[index];
  const card = getCard(run,entry);
  const cost = cardCost(card,entry);
  if(b.energy<cost) return false;
  if(requiresTarget(card) && !(b.enemies[enemyIndex]?.hp>0)) return false;
  const rewards = cardStatusRewards(b,card.kind);
  const attackBleed = card.kind==='attack' ? (b.customStatuses??[])
    .filter(status=>status.rule.trigger==='attackBleed' && status.layers>0)
    .reduce((total,status)=>total+status.rule.bleedAmount,0) : 0;
  const vigor = card.kind==='attack' ? (b.vigor??0) : 0;
  if(card.kind==='attack') b.vigor=0;
  b.energy -= cost;
  b.hand.splice(index,1);
  for(const effect of card.effects){
    if(card.kind==='power' && effect.type!=='furnaceAspect' && effect.type!=='regeneration'){
      const buff={entry,effect,enemyIndex,activations:0};
      (b.buffs ??= []).push(buff);
      if(!effect.nextTurn) triggerPowerBuff(run,card,buff);
    } else if(effect.nextTurn) (b.pending ??= []).push({entry,effect,enemyIndex,vigor});
    else resolveEffect(run,card,entry,effect,targetsFor(b,card,effect,enemyIndex),{vigor});
    if(run.hp===0) break;
  }
  (card.exhaust || card.kind==='power' ? b.exhaust : b.discard).push(entry);
  log(run,'打出「'+card.name+(entry.upgraded?'+':'')+'」。');
  if(attackBleed>0 && run.hp>0){
    const enemies = new Set(card.effects.filter(effect=>effectTarget(card,effect)!=='self')
      .flatMap(effect=>targetsFor(b,card,effect,enemyIndex)));
    for(const enemy of enemies) applyAilment(run,enemy,'bleed',attackBleed);
  }
  for(const {actor,rule,amount} of rewards){
    if(run.hp===0) break;
    if(!amount || targetHp(run,actor)===0) continue;
    log(run,targetName(run,actor)+'触发「'+rule.name+'」，'+STATUS_REWARDS[rule.rewardType]+' '+(amount>0?'+':'')+amount+'。');
    resolveEffectSegment(run,'status',rule.rewardType,amount,[actor],'');
  }
  settleBattle(run);
  return true;
}
function enemyIntent(foe,battle) {
  const {pattern,step,loop}=foe;
  const index=step>=pattern.length && loop?.length ? loop[(step-pattern.length)%loop.length]-1 : step%pattern.length;
  const [action,value] = pattern[index];
  const damage = scaledDamage(value+attackStatusBonus(foe),foe,battle);
  const descriptions = {
    attack:'攻击 '+damage, guard:'格挡 '+value, fortify:'格挡 '+value+' ＋ 2 力量',
    weak:'施加 '+value+' 虚弱', weaken:'攻击 '+damage+' ＋ 1 虚弱', vulnerable:'施加 '+value+' 易伤',
  };
  return {action,value,damage,text:descriptions[action],attack:action==='attack'||action==='weaken'};
}
function endTurn(run) {
  if(run.view!=='combat') return;
  const b = run.battle;
  const retained = [];
  for(const entry of b.hand){
    (hasCardKeyword(getCard(run,entry),entry,'retain') ? retained : b.discard).push(entry);
  }
  b.hand = retained;
  if(b.regeneration>0){
    const recovered = changeHp(run,b.regeneration);
    b.regeneration--;
    log(run,'再生回复 '+recovered+' 点生命，剩余 '+b.regeneration+' 层。');
  }
  // Resolve all intents as shown to the player before the enemy phase begins.
  const turns = b.enemies.filter(foe=>foe.hp>0).map(foe=>({foe,...enemyIntent(foe,b)}));
  b.weak = Math.max(0,b.weak-1);
  b.vulnerable = Math.max(0,b.vulnerable-1);
  for(const {foe,action,value,damage,text,attack} of turns){
    foe.block = 0;
    log(run,foe.name+'：'+text+'。');
    if(attack){
      attackStatusBonus(foe,true);
      strikeTarget(run,b,damage);
    }
    if(action==='guard' || action==='fortify') foe.block=value;
    if(action==='fortify') foe.strength+=2;
    if(action==='weaken') b.weak++;
    if(action==='weak') b.weak+=value;
    if(action==='vulnerable') b.vulnerable+=value;
    foe.step++;
    foe.weak=Math.max(0,foe.weak-1);
    foe.vulnerable=Math.max(0,foe.vulnerable-1);
    if(run.hp===0){run.view='defeat';return;}
  }
  for(const actor of [b,...b.enemies]) decayCustomStatuses(actor);
  b.turn++;
  run.rounds++;
  b.block=0;
  b.energy=run.hero.energy;
  tickFurnaceAspects(run);
  if(b.enemies.every(foe=>foe.hp===0)){settleBattle(run);return;}
  drawCards(b,run.hero.draw);
  log(run,'第 '+b.turn+' 回合开始。');
  const pending = b.pending ?? [];
  b.pending = [];
  for(const {entry,effect,enemyIndex,vigor} of pending){
    const card = getCard(run,entry);
    const targets = targetsFor(b,card,effect,enemyIndex);
    log(run,'「'+card.name+'」的下回合效果结算。');
    resolveEffect(run,card,entry,effect,targets,{vigor});
    if(run.hp===0) break;
  }
  for(const buff of b.buffs ?? []){
    if(run.hp===0) break;
    triggerPowerBuff(run,getCard(run,buff.entry),buff);
  }
  settleBattle(run);
}

function validateDesign(input) {
  const reject = (message)=>{ throw new Error(message); };
  const string = (value,max)=>typeof value==='string' && value.trim().length>0 && value.length<=max;
  const integer = (value,min,max)=>Number.isInteger(value) && value>=min && value<=max;
  const optionalBoolean = value=>value===undefined || typeof value==='boolean';
  const id = (value)=>typeof value==='string' && /^[\w-]{1,64}$/.test(value);
  if(input?.version!==1 || !Array.isArray(input.cards) || !Array.isArray(input.heroes)) reject('请选择工坊导出的 v1 JSON 文件。');
  if(input.cards.length>150 || input.heroes.length>30) reject('最多可保存 150 张卡牌和 30 个角色。');
  const cardIds = new Set();
  const heroIds = new Set();
  for(const card of input.cards){
    if(!card || !id(card.id) || cardIds.has(card.id) || !string(card.name,28)) reject('有卡牌名称、ID 或重复项无效。');
    if(!Object.hasOwn(KINDS,card.kind) || !Object.hasOwn(RARITIES,card.rarity) || !integer(card.cost,0,9)) reject(card.name+'的类型、稀有度或费用无效。');
    if(card.target!==undefined && card.target!=='single' && card.target!=='all') reject(card.name+'的旧版目标无效。');
    if(!Array.isArray(card.effects) || card.effects.length<1 || card.effects.length>6) reject(card.name+'需要 1 至 6 项效果。');
    if(![card.exhaust,card.innate,card.retain].every(optionalBoolean)) reject(card.name+'的固有、保留或消耗属性无效。');
    if(card.upgradeCostReduction!==undefined && !integer(card.upgradeCostReduction,0,9)) reject(card.name+'的升级减费无效。');
    for(const effect of card.effects){
      if(!effect || !Object.hasOwn(EFFECTS,effect.type) || !integer(effect.amount,-MAX_EFFECT_AMOUNT,MAX_EFFECT_AMOUNT) || !integer(effect.upgrade,-MAX_EFFECT_AMOUNT,MAX_EFFECT_AMOUNT)) reject(card.name+'的效果数值无效。');
      if(effect.target!==undefined && (!Object.hasOwn(TARGETS,effect.target) || (onlySelfTarget(effect.type) && effect.target!=='self'))) reject(card.name+'的效果目标无效。');
      if(effect.type==='comboEnergy' && card.kind!=='power') reject(card.name+'的连击回能效果需要能力牌。');
      if(effect.type==='bleedBlock' && card.kind!=='power') reject(card.name+'的出血格挡效果需要能力牌。');
      if(effect.type==='furnaceAspect' && (effect.amount<1 || amountOf(effect,{upgraded:true})<1)) reject(card.name+'的熔炉增益至少持续 1 回合。');
      if(!optionalBoolean(effect.nextTurn)) reject(card.name+'的效果结算时机无效。');
      if(effect.hits!==undefined && !integer(effect.hits,1,MAX_EFFECT_HITS)) reject(card.name+'的效果段数无效。');
      if(effect.upgradeHits!==undefined && !integer(effect.upgradeHits,0,MAX_EFFECT_HITS-1)) reject(card.name+'的升级增加段数无效。');
      if(hitsOf(effect,{upgraded:true})>MAX_EFFECT_HITS) reject(card.name+'的单项效果升级后最多 '+MAX_EFFECT_HITS+' 段。');
      if(effect.growth!==undefined && (!canGrowEffect(card.kind,effect.type) || !integer(effect.growth,-MAX_POWER_GROWTH,MAX_POWER_GROWTH))) reject(card.name+'的每回合成长无效。');
      if(effect.type==='status'){
        const rule=effect.status;
        if(!rule || !string(rule.name,24) || !integer(rule.decay,0,99) || typeof rule.keepNegative!=='boolean' ||
          !Object.hasOwn(STATUS_TRIGGERS,rule.trigger)) reject(card.name+'的自定义状态设置无效。');
        if(rule.trigger==='card' && (!Object.hasOwn(KINDS,rule.cardKind) || !Object.hasOwn(STATUS_REWARDS,rule.rewardType) ||
          !integer(rule.rewardAmount,1,99) || (effectTarget(card,effect)!=='self' && onlySelfTarget(rule.rewardType)))) reject(card.name+'的状态牌型触发设置无效。');
        if(rule.trigger==='attack' && (!integer(rule.attackHits,1,MAX_EFFECT_HITS) || !integer(rule.attackBonus,1,99))) reject(card.name+'的状态攻击增益设置无效。');
        if(rule.trigger==='attackBleed' && (!integer(rule.bleedAmount,1,99) || effectTarget(card,effect)!=='self')) reject(card.name+'的攻击施加出血设置无效。');
      }
    }
    cardIds.add(card.id);
  }
  for(const hero of input.heroes){
    if(!hero || !id(hero.id) || heroIds.has(hero.id) || !string(hero.name,28)) reject('有角色名称、ID 或重复项无效。');
    if(typeof hero.description!=='string'||hero.description.length>160 || !integer(hero.hp,1,999) || !integer(hero.energy,1,9) || !integer(hero.draw,1,12)) reject(hero.name+'的说明或基础数值无效。');
    if(!Array.isArray(hero.deck) || !Array.isArray(hero.pool)) reject(hero.name+'的起手牌组或奖励池无效。');
    const inDeck = new Set();
    let total=0;
    for(const entry of hero.deck){
      if(!entry || !cardIds.has(entry.id) || inDeck.has(entry.id) || !integer(entry.count,1,20)) reject(hero.name+'的起手牌组包含无效卡牌或重复记录。');
      inDeck.add(entry.id);
      total+=entry.count;
    }
    if(total<1 || total>60) reject(hero.name+'的起手牌组需要 1 至 60 张牌。');
    if(hero.pool.some(key=>!cardIds.has(key)) || new Set(hero.pool).size!==hero.pool.length) reject(hero.name+'的奖励池包含无效卡牌或重复记录。');
    heroIds.add(hero.id);
  }
  if(input.enemies===undefined) return {...input,enemies:defaultEnemyDesigns()};
  if(!Array.isArray(input.enemies) || input.enemies.length>150) reject('最多可保存 150 个敌人设计。');
  const enemyIds=new Set();
  for(const enemy of input.enemies){
    if(!enemy || !id(enemy.id) || enemyIds.has(enemy.id) || !string(enemy.name,28)) reject('有敌人名称、ID 或重复项无效。');
    if(!Object.hasOwn(ENEMY_KINDS,enemy.kind) || !integer(enemy.hp,1,9999) ||
      (enemy.shape!==undefined && !ENEMY_SHAPES.includes(enemy.shape))) reject(enemy.name+'的类型、生命或外观无效。');
    for(const [label,plan] of [['普通',enemy.intents],['进阶',enemy.advanced]]){
      if(label==='进阶' && plan===undefined) continue;
      if(!Array.isArray(plan?.turns) || !integer(plan.turns.length,1,MAX_ENEMY_TURNS) ||
        plan.turns.some(turn=>!Array.isArray(turn) || turn.length!==2 || !Object.hasOwn(ENEMY_ACTIONS,turn[0]) || !integer(turn[1],0,9999))){
        reject(enemy.name+'的'+label+'意图无效。');
      }
      if(!Array.isArray(plan.loop) || plan.loop.some((turn,index)=>!integer(turn,1,plan.turns.length) || (index>0 && turn<=plan.loop[index-1]))){
        reject(enemy.name+'的'+label+'循环回合必须按顺序选取有效回合。');
      }
    }
    if(!Array.isArray(enemy.spawns)) reject(enemy.name+'的出现节点无效。');
    const nodes=new Set();
    for(const spawn of enemy.spawns){
      if(!spawn || !integer(spawn.act,1,ACT_COUNT) || !combatNodes(spawn.act).some(room=>room.node===spawn.node) ||
        !integer(spawn.count,1,MAX_ENEMY_COPIES)) reject(enemy.name+'的出现节点或数量无效。');
      const key=spawn.act+'-'+spawn.node;
      if(nodes.has(key)) reject(enemy.name+'的出现节点有重复记录。');
      nodes.add(key);
    }
    enemyIds.add(enemy.id);
  }
  return input;
}

let savedWarning = '';
function read(key) {
  try { return JSON.parse(localStorage.getItem(key)); }
  catch { return null; }
}
function write(key,value) {
  try {
    if(value===null) localStorage.removeItem(key);
    else localStorage.setItem(key,JSON.stringify(value));
  } catch {
    savedWarning='浏览器存储不可用。本次设计可通过「导出 JSON」备份。';
    notify(savedWarning);
  }
}

function notify(message) {
  toast.textContent=message;

function options(map,selected) {
  return Object.entries(map).map(([key,label])=>'<option value="'+key+'" '+(selected===key?'selected':'')+'>'+esc(label)+'</option>').join('');
}
function sumDeck(hero) { return hero.deck.reduce((total,entry)=>total+entry.count,0); }
function ailmentRule({name,threshold,damage,vulnerable}) {
  return name+'每 '+threshold+' 层引爆，造成 '+damage+' 点固定伤害'+(vulnerable?'并附加 '+vulnerable+' 回合易伤':'')+'。';
}
function customStatusRule(rule) {
  const lifetime=(rule.decay?'每回合减少 '+rule.decay+' 层':'层数随战斗持续')+
    (rule.keepNegative?'，可降为负层':'，降至 0 层时结束');
  if(rule.trigger==='card') return lifetime+'。打出'+KINDS[rule.cardKind]+'牌后，持有者每层获得 '+rule.rewardAmount+' '+STATUS_REWARDS[rule.rewardType]+'。';
  if(rule.trigger==='attack') return lifetime+'。接下来 '+rule.attackHits+' 段攻击每层增加 '+rule.attackBonus+' 点基础伤害。';
  if(rule.trigger==='attackBleed') return lifetime+'。每打出一张攻击牌，对每个存活目标施加 '+rule.bleedAmount+' 层出血。';
  return lifetime+'。';
}
function effectText(card,effect,entry,n=amountOf(effect,entry)) {
  const mode=effectTarget(card,effect);
  const group={self:'自己',single:'选中的敌人',all:'敌方全体'}[mode];
  const recipient=mode==='self'?'':'使'+group;
  const hits=hitsOf(effect,entry);
  const suffix=hits>1?' × '+hits:'';
  const value='<b>'+n+suffix+'</b>';
  const absolute='<b>'+Math.abs(n)+suffix+'</b>';
  if(effect.type==='comboEnergy'){
    return '每造成 <b>'+COMBO_DAMAGE_SEGMENTS+'</b> 段伤害，'+(n<0?'失去':'回复')+' <b>'+Math.abs(n*hits)+'</b> 点能量';
  }
  if(effect.type==='bleedBlock'){
    return '每当任意目标引爆出血，'+(n<0?'失去':'获得')+' <b>'+Math.abs(n*hits)+'</b> 点格挡';
  }
  if(effect.type==='furnaceAspect'){
    return '获得 <b>'+FURNACE_TEMP_HP+suffix+'</b> 点临时生命。持续 <b>'+n+'</b> 回合，攻击牌每段基础伤害 +'+FURNACE_ATTACK_BONUS+
      '。增益结束时，对敌方全体造成 <b>'+FURNACE_END_DAMAGE+'</b> 点伤害。';
  }
  const layers=(n<0?'从'+group+'移除 ':'对'+group+'施加 ')+absolute+' 层';
  const ailment=AILMENTS[effect.type];
  if(ailment) return '<span title="'+ailmentRule(ailment)+'">'+layers+ailment.name+'</span>';
  if(effect.type==='status'){
    if(n>0 && effect.status.trigger==='attackBleed' && effect.status.decay===1 && !effect.status.keepNegative){
      return '<b>'+n*hits+'</b> 回合内，每打出一张攻击牌，对目标施加 <b>'+effect.status.bleedAmount+'</b> 层出血';
    }
    const statusLayers=n<0 && effect.status.keepNegative ? '使'+group+'的「'+esc(effect.status.name)+'」减少 '+absolute+' 层' : layers+'「'+esc(effect.status.name)+'」';
    return '<span title="'+esc(customStatusRule(effect.status))+'">'+statusLayers+'</span>';
  }
  return {
    damage:n<0?'为'+group+'回复 '+absolute+' 点生命':'对'+group+'造成 '+value+' 点伤害',
    block:recipient+(n<0?'失去':'获得')+' '+absolute+' 点格挡',
    draw:n<0?'从手牌右侧弃掉 '+absolute+' 张牌':'抽 '+value+' 张牌',
    energy:(n<0?'失去':'获得')+' '+absolute+' 点能量',
    heal:(n<0?recipient+'失去':(mode==='self'?'回复':'为'+group+'回复'))+' '+absolute+' 点生命',
    strength:card.kind==='power' && effect.growth ? (mode==='self'?'':group+'的')+'力量加成 '+value :
      recipient+(n<0?'失去':'获得')+' '+absolute+' 点力量',
    vigor:(n<0?'失去':'获得')+' '+absolute+' 层活力',
    dexterity:(n<0?'失去':'获得')+' '+absolute+' 层敏捷',
    regeneration:(n<0?'失去':'获得')+' '+absolute+' 层再生。己方回合结束时，按层数回血，然后减 1 层',
    weak:layers+'虚弱',
    vulnerable:layers+'易伤',
  }[effect.type];
}
function cardText(card,entry={}) {
  const lines=card.effects.map(effect=>{
    const text=effectText(card,effect,entry);
    if(effect.type==='furnaceAspect' || effect.type==='regeneration') return (effect.nextTurn?'下回合开始时，':'')+text;
    if(effect.type==='comboEnergy' || effect.type==='bleedBlock') return (effect.nextTurn?'下回合起，':'')+text;
    if(card.kind!=='power') return (effect.nextTurn?'下回合开始时，':'')+text;
    const timing=effect.nextTurn?'下回合起每回合，':'打出时及以后每回合，';
    const growth=effect.growth ? '（每回合每段 '+(effect.growth>0?'+':'')+effect.growth+'）' : '';
    return timing+text+growth;
  });
  const keywords=[
    hasCardKeyword(card,entry,'innate')?'固有':'',
    hasCardKeyword(card,entry,'retain')?'保留':'',
    card.exhaust && card.kind!=='power'?'消耗':'',
  ].filter(Boolean);
  if(keywords.length) lines.push('<span class="card-keyword-text">'+keywords.join(' · ')+'</span>');
  return lines.join('<br>');
}
function cardTile(card,entry={},action='',attrs='',flags='') {
  const content='<span class="card-top"><span class="card-cost" title="能量消耗">'+cardCost(card,entry)+'</span><span class="card-rarity">'+RARITIES[card.rarity]+'</span></span>'+
    '<span class="card-symbol" aria-hidden="true">'+{attack:'✶',skill:'◈',power:'✧'}[card.kind]+'</span>'+
    '<span class="card-name">'+esc(card.name)+(entry.upgraded?'<em>＋</em>':'')+'</span>'+
    '<span class="card-kind">'+KINDS[card.kind]+'</span>'+
    '<span class="card-text">'+cardText(card,entry)+'</span>';
  const cls='card '+card.kind+' '+card.rarity+' '+flags;
  return action?button(content,action,attrs,cls):'<article class="'+cls+'">'+content+'</article>';
}
function route() {
  const completed=run.view==='act-clear'||run.view==='victory';
  const rooms=roomsForAct(run);
  return '<ol class="route" aria-label="航线进度" style="--route-steps:'+rooms.length+'">'+rooms.map((room,index)=>
    '<li class="'+(index<run.room || completed?'passed':'')+(index===run.room&&!completed?' current':'')+'" '+(index===run.room&&!completed?'aria-current="step"':'')+'><i aria-hidden="true">'+room.icon+'</i><span>'+room.name+'</span></li>').join('')+'</ol>';
}
function lifeBar(hp,maxHp) {
  return '<span class="life" role="meter" aria-label="生命" aria-valuemin="0" aria-valuemax="'+maxHp+'" aria-valuenow="'+hp+'"><i style="width:'+(hp/maxHp*100)+'%"></i><b>'+hp+' / '+maxHp+'</b></span>';
}
function relicStrip() {
  return run.relics.map(id=>{
    const relic=RELICS.find(r=>r.id===id);
    return '<span class="relic-pill" title="'+relic.text+'">'+relic.icon+' '+relic.name+'</span>';
  }).join('');
}

function statuses(actor,id='') {
  const parts=Object.entries(STATUSES).filter(([id])=>actor[id]>0).map(([id,label])=>'<span>'+label+' '+actor[id]+'</span>');
  for(const [type,ailment] of Object.entries(AILMENTS)){
    if(actor[type]>0) parts.push('<span class="'+type+'" title="'+ailmentRule(ailment)+'">'+ailment.name+' '+actor[type]+' / '+ailment.threshold+'</span>');
  }
  for(const {rule,layers,hitsLeft} of actor.customStatuses??[]){
    const remaining=rule.trigger==='attack'?' · 余 '+hitsLeft+' 段':'';
    parts.push('<span class="custom-status" title="'+esc(customStatusRule(rule))+'">'+esc(rule.name)+' '+layers+remaining+'</span>');
  }
  if(actor.strength) parts.push('<span>力量 '+actor.strength+'</span>');
  if(actor.regeneration>0) parts.push('<span title="己方回合结束时，按层数回血，然后减 1 层。">再生 '+actor.regeneration+'</span>');
  for(const aspect of actor.furnaceAspects??[]){
    parts.push('<span class="custom-status">'+FURNACE_CARD_NAME+' · '+aspect.turns+' 回合 · 临时生命 '+aspect.hp+'</span>');
  }
  if(actor.vigor) parts.push('<span title="层数加到下一张攻击牌的每段基础伤害，打出时消耗全部活力。">活力 '+actor.vigor+'</span>');
  if(actor.dexterity) parts.push('<span title="每层调整攻击牌和技能牌提供给自己的每段格挡。">敏捷 '+actor.dexterity+'</span>');
  if(actor.block>0) parts.push('<span>格挡 '+actor.block+'</span>');
  return '<span class="statuses"'+(id?' id="'+id+'"':'')+'>'+parts.join('')+'</span>';
}

  const buffCount=b.buffs?.length ?? 0;
  const room=roomsForAct(run)[run.room];
  const targeted=b.hand.find(entry=>entry.uid===aimed);
  const enemies=b.enemies.map((foe,index)=>{
    const intent=enemyIntent(foe,b);
    const live=foe.hp>0;
    const statusId='enemy-status-'+index;
    const kind=ENEMY_KINDS[foe.kind];
    return '<div class="enemy-wrap">'+button(
      '<span class="intent '+(intent.attack?'danger':'')+'">'+(live?esc(intent.text):'已击败')+'</span>'+

      'target','data-index="'+index+'" '+(!live?'disabled':'')+' aria-describedby="'+statusId+'" aria-label="'+esc(foe.name+'，'+(kind?kind+'，':'')+(live?intent.text:'已击败'))+'，生命 '+foe.hp+' / '+foe.maxHp+'"',
      'unit enemy '+(!live?'fallen':'')+(targeted&&live?' targetable':''))+'</div>';
  }).join('');
  return '<section class="battle"><header class="battle-label"><div><p class="overline">'+(room.type==='boss'?'首领战':'遭遇战')+'</p><h1>'+room.name+'</h1></div><span class="turn">回合 '+b.turn+'</span></header>'+
    '<div class="arena"><div class="unit player"><span class="intent neutral">我方</span><span class="avatar-art" aria-hidden="true"><i></i></span><b class="unit-title">'+esc(run.hero.name)+'</b>'+lifeBar(run.hp,run.maxHp)+statuses(b)+'</div><div class="enemies'+(b.enemies.length>2?' enemy-grid':'')+'">'+enemies+'</div></div>'+
    '<div class="battle-bar"><div class="resource"><span class="energy-icon">✦</span><span><b>'+b.energy+'</b> 能量</span></div>'+
    '<div class="piles">'+button('抽牌 '+b.draw.length,'pile','data-id="draw"','text-button')+button('弃牌 '+b.discard.length,'pile','data-id="discard"','text-button')+button('消耗 '+b.exhaust.length,'pile','data-id="exhaust"','text-button')+'</div>'+
    '<div class="actions">'+(pendingCount?button('下回合待结算 '+pendingCount,'show-pending','','text-button'):'')+
    (buffCount?button('能力 Buff '+buffCount,'show-buffs','','text-button'):'')+
    button('战报','show-log','','text-button')+button('结束回合 ↵','end-turn','','button primary desktop-end-turn')+'</div></div>'+
    '<div class="hand-head"><h2>手牌 <span>'+b.hand.length+' / '+HAND_LIMIT+'</span></h2><p aria-live="polite">'+
    (targeted?'为「'+esc(getCard(run,targeted).name)+'」选择敌人。<span class="desktop-hint"> Esc 取消。</span>':
      '<span class="desktop-hint">点击出牌，数字键 1–9 可选择手牌。</span><span class="touch-hint">'+(b.hand.length>2?'左右滑动查看手牌，点按出牌。':'点按出牌。')+'</span>')+'</p></div>'+
    '<div class="hand" data-deal="'+run.room+'-'+b.turn+'">'+b.hand.map((entry,index)=>{
      const card=getCard(run,entry);
      const unaffordable=b.energy<cardCost(card,entry);
      return cardTile(card,entry,'play','data-id="'+entry.uid+'" aria-pressed="'+(entry.uid===aimed)+'" aria-keyshortcuts="'+(index<9?index+1:'')+'" '+(unaffordable?'disabled':''),
        (entry.uid===aimed?'chosen ':'')+(unaffordable?'unaffordable':''));
    }).join('')+(b.hand.length?'':'<p class="muted">手牌已空。</p>')+'</div>'+
    (run.relics.length?'<div class="relic-strip">'+relicStrip()+'</div>':'')+
    '<div class="touch-battle-controls">'+(targeted?
      '<span>选择敌人</span>'+button('取消选敌','cancel-target','','button secondary'):
      '<span class="resource">✦ <b>'+b.energy+'</b> 能量</span>'+button('结束回合','end-turn','','button primary'))+'</div></section>';
}

}
const DEALS = {
  card:['收录新牌','从商人提供的牌中选 1 张加入牌组。','▤'],
  upgrade:['校准一张牌','选择 1 张牌，启用它配置的升级效果。','✦'],
  remove:['丢弃旧牌','从牌组永久移除 1 张牌。','×'],
  heal:['应急疗养','回复 15 点生命。','✚'],
  relic:['打捞遗物','随机获得 1 件未拥有的遗物。','◈'],
};
function eligibleDeck(action) {
  return run.deck.filter(entry=>action!=='upgrade' || (!entry.upgraded && canUpgrade(getCard(run,entry))));
}
function dealAllowed(key) {
  if(key==='card') return run.merchantCards.length>0;
  if(key==='upgrade') return eligibleDeck(key).length>0;
  if(key==='remove') return run.deck.length>1;
  if(key==='heal') return run.hp<run.maxHp;
  if(key==='relic') return RELICS.some(r=>!hasRelic(run,r.id));
  return false;
}
function canClaimDeal(key) {
  return run.view==='merchant' && run.taken.length<merchantLimit(run) && !run.taken.includes(key) && dealAllowed(key);
}
function merchant() {
  const limit=merchantLimit(run);
  return '<section class="stage"><div class="stage-head"><p class="overline">免费补给</p><h1>漂流商站</h1><p>每项可选一次，最多选 '+limit+' 项。你也可以提前离开。</p></div><div class="deals">'+
    Object.entries(DEALS).map(([key,[title,description,icon]])=>{
      const taken=run.taken.includes(key);
      const allowed=dealAllowed(key);
      return button('<span class="deal-icon">'+icon+'</span><b>'+title+'</b><span>'+description+'</span>'+
        (taken?'<small>已领取</small>':(!allowed?'<small>当前不可用</small>':'')),'deal','data-id="'+key+'" '+(taken||run.taken.length>=limit||!allowed?'disabled':''),'deal');
    }).join('')+'</div><div class="actions end"><span class="muted">已领取 '+run.taken.length+' / '+limit+'</span>'+button('离开商站 ↗','advance','','button primary')+'</div>'+
    (run.relics.length?'<div class="relic-strip">'+relicStrip()+'</div>':'')+'</section>';

function render() {
  document.querySelector('#nav-game').setAttribute('aria-current',view!=='lab'?'page':'false');
  document.querySelector('#nav-lab').setAttribute('aria-current',view==='lab'?'page':'false');
  if(view==='lab'){screen.innerHTML=workshop();return;}
  if(view==='home'||!run){screen.innerHTML=home();return;}
  const page={draft:rewards,reward:rewards,'boss-reward':rewards,combat,merchant,chest,'act-clear':actClear,'boss-clear':bossClear,victory:result,defeat:result}[run.view];
  const previousHand=run.view==='combat'?screen.querySelector('.hand'):null;
  const handScroll=previousHand?.scrollLeft;
  screen.innerHTML=runHeader()+page();
  if(handScroll){
    const hand=screen.querySelector('.hand');
    if(hand.dataset.deal===previousHand.dataset.deal) hand.scrollLeft=handScroll;
  }
}
